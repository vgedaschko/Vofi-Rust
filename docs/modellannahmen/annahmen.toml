erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 3, Zeithorizont", "Fachspezifikation Rechenkern, R-5.8, R-5.11, R-11.14"]
bemerkung = "Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): Die Annahme betrifft einen künftigen Wert, nicht die Regel."

[[annahme]]
id = "MA-004"
titel = "KfW-Darlehen als Ersatz für Eigenmittel bei der NBank"
annahme = "Ein KfW-Darlehen zählt nicht als Eigenmittel; die geforderten 20 % sind aus Eigenkapital aufzubringen."
grund = "Die Richtlinie verlangt Eigenmittel von mindestens 20 % der zuwendungsfähigen Kosten (Geld, Eigenleistungen, Wert des lastenfreien Grundstücks; mindestens die Hälfte Geld oder Grundstück) und kennt „als Ersatz der Eigenmittel anerkannte Fremdmittel“. Eine Anerkennung ist also möglich; unter welchen Voraussetzungen, steht nicht da."
alternative = "Die NBank erkennt ein KfW-Darlehen oder andere Fremdmittel ganz oder teilweise als Eigenmittelersatz an; sie stehen dann im Rang nach dem Förderdarlehen."
grundlage = "Richtlinie Mietwohnraum 2026, Nummern 5.2.6, 11.4 und 11.5; Antragsvordruck mit eigener Zeile für KfW-Darlehen. Angesetzt ist der ungünstigere Fall."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "NBANK-VORDRUCK-1011"]
gewicht = "hoch"
wirkung = "Eigenkapitalbedarf und damit Eigenkapitalrendite und Finanzierbarkeit des Vorhabens."
sichtbar = "kunde"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-5.12, R-11.14"]
bemerkung = "Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): Die Anerkennung von Fremdmitteln als Eigenmittelersatz ist nach Nummer 11.5 möglich; offen sind nur noch die Voraussetzungen. Die vorsichtige Voreinstellung bleibt bis zum Gespräch mit der NBank."

[[annahme]]
