[[annahme]]
id = "MA-020"
titel = "Umlage für den Heizungstausch in der NBank-Bindung"
annahme = "Während der Mietbindung der NBank wird keine Umlage für den Heizungstausch angesetzt."
grund = "Die Richtlinie lässt Mieterhöhungen in der Bindung nach bestimmten Vorschriften zu und nennt die neue Umlage für den Heizungstausch dabei nicht."
alternative = "Die Umlage ist auch in der Bindung zulässig, soweit die Höchstmiete eingehalten wird."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 5.4.5. Angesetzt ist der für den Vermieter ungünstigere Fall."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "BGB-559E"]
gewicht = "gering"
wirkung = "Mieterlös gebundener Wohnungen nach Heizungstausch."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Fördermodul"]
bemerkung = "Aus Prüfrunde 3 (Jurist)."

[[annahme]]
id = "MA-021"
titel = "Nicht abziehbare Vorsteuer als zuwendungsfähige Kosten der NBank"
annahme = "Kann der Bauherr die Vorsteuer nicht abziehen, zählt die Umsatzsteuer zu den zuwendungsfähigen Kosten."
grund = "Die Richtlinie regelt die Behandlung der Umsatzsteuer nicht ausdrücklich. Sie erklärt in Nummer 12.3.1 die Verwaltungsvorschriften zu § 44 LHO für anwendbar, zu denen die ANBest-P gehören; dort ist die Frage zu klären, gelesen sind sie noch nicht."
alternative = "Zuwendungsfähig sind nur die Nettokosten; die Umsatzsteuer ist zusätzlich zu finanzieren."
grundlage = "Übliche Regel des Zuwendungsrechts, hier nicht am Text gelesen: Nur die abziehbare Vorsteuer ist nicht zuwendungsfähig. Ausnahme von der Vorsichtsregel: Im Wohnungsbau ist die Umsatzsteuer echter Aufwand. Die ungünstige Lesart senkte die Förderung auf die Baukosten um bis zu einem Sechstel (19/119 der Bruttokosten), weniger, wenn die Bemessungsgrenze kappt; die umsatzsteuerfreien Grundstückskosten berührt sie nicht."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "NI-ANBEST-P"]
gewicht = "mittel"
wirkung = "Höhe von Darlehen und Zuschuss; Finanzierungslücke."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Projekt am Haushaltsrecht (ANBest-P zu § 44 LHO), dann NBank"
wiedervorlage = "sobald die ANBest-P gelesen sind, spätestens nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regel- und Förderkatalog"]
bemerkung = "Aus der dritten Überarbeitung des Rechercheberichts; Größe der Wirkung und Klärungsweg nach Prüfrunde 4 (Finanzmathematiker, Jurist) berichtigt."

[[annahme]]
id = "MA-022"
titel = "Leerstand beim Mieterwechsel und Sonderabschreibung"
annahme = "Ein Leerstand zwischen zwei Mietverhältnissen schadet der Sonderabschreibung nicht, solange die Vermietungsabsicht fortbesteht. Schädlich bleiben Selbstnutzung, unentgeltliche Überlassung, vorübergehende Beherbergung und die Aufgabe der Vermietungsabsicht."
grund = "Das Gesetz verlangt, dass die Wohnung der entgeltlichen Überlassung zu Wohnzwecken dient; ob das einen Leerstand beim Mieterwechsel einschließt, ergibt sich aus der Verwaltungsauffassung, die nicht gelesen ist."
alternative = "Jeder Leerstand im Nutzungszeitraum nach § 7b, dem Jahr der Anschaffung oder Herstellung und den neun folgenden Jahren, löst die rückwirkende Versagung der Sonderabschreibung aus."
grundlage = "§ 7b Abs. 2 und 4 EStG: Das Gesetz stellt darauf ab, ob die Wohnung der entgeltlichen Überlassung zu Wohnzwecken dient, also auf ihre Zweckbestimmung (Einschätzung des Juristen am Wortlaut, Prüfrunden 3 und 4). Ausnahme von der Vorsichtsregel: Die ungünstige Lesart striche bei jedem Leerstandsstress die gesamte Sonderabschreibung und machte den Stressfall unbrauchbar."
quellen = ["ESTG-7B"]
gewicht = "mittel"
wirkung = "Steuerzahlungen im Neubau mit Sonderabschreibung; Ergebnis im Stressfall Leerstand."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Steuerberater"
wiedervorlage = "mit der Fachspezifikation des Steuermoduls (Phase 1)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regel- und Förderkatalog"]
bemerkung = "Aus Prüfrunde 3 (Jurist) und der dritten Überarbeitung des Rechercheberichts; schädliche Nutzungen und Begriff „Nutzungszeitraum“ aus Prüfrunde 4 (Jurist)."

[[annahme]]
id = "MA-023"
titel = "Kostenbasis der Baukostenobergrenze der Sonderabschreibung"
annahme = "Die Baukostenobergrenze der Sonderabschreibung wird an derselben Kostensumme gemessen wie die Förderung der NBank: bei Herstellung an den Kostengruppen 200 bis 700, beim Ersterwerb am Kaufpreis nebst Erwerbskosten, höchstens dem Marktwert."
grund = "Welche Kosten in die Grenze des § 7b EStG einzurechnen sind, beantwortet das Gesetz nicht nach Kostengruppen. Für die Anschaffung ist keine Kostensumme bestimmt; Kostengruppen gibt es beim Kauf vom Bauträger nicht."
alternative = "Engere Kostensumme, etwa ohne Außenanlagen oder Baunebenkosten, beim Erwerb nur der Gebäudeanteil des Kaufpreises mit anteiligen Erwerbsnebenkosten; die Grenze würde seltener überschritten."
grundlage = "§ 7b Abs. 2 EStG; Richtlinie Mietwohnraum 2026, Nummern 1.5, 5.3.2.1 und 5.3.2.4 (Bemessungsgrundlage der NBank, beim Ersterwerb Kaufpreis nebst Erwerbskosten, höchstens Marktwert). Angesetzt ist die weitere Kostensumme und damit der ungünstigere Fall."
quellen = ["ESTG-7B", "NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "mittel"
wirkung = "Ob die Sonderabschreibung überhaupt gewährt wird; die Grenze ist eine Ausschlussgrenze."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Steuerberater"
wiedervorlage = "mit der Fachspezifikation des Steuermoduls (Phase 1)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regel- und Förderkatalog"]
bemerkung = "Aus Prüfrunde 3 (Fachexperte) und der dritten Überarbeitung des Rechercheberichts; Ersterwerb aus Prüfrunde 4 (Jurist)."

[[annahme]]
id = "MA-024"
titel = "Zeitlicher Anwendungsbereich des Wärmepumpen-Nachweises"
annahme = "Für jede im Betrachtungszeitraum eingebaute Wärmepumpe ist der Nachweis der Jahresarbeitszahl erforderlich; ohne ihn wird nur die Hälfte der Kosten umgelegt."
grund = "Für welche Einbauzeitpunkte und Mietverhältnisse die Vorschrift gilt, ist am Übergangsrecht nicht geprüft."
alternative = "Die Vorschrift gilt nur für bestimmte Zeiträume; außerhalb ist die volle Umlage ohne Nachweis möglich."
grundlage = "§ 559f BGB. Angesetzt ist der für den Vermieter ungünstigere Fall."
quellen = ["BGB-559F"]
gewicht = "gering"
wirkung = "Mieterlös nach Einbau einer Wärmepumpe."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Anwalt"
wiedervorlage = "mit der Rechtsprüfung vor dem Kundeneinsatz"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regel- und Förderkatalog"]
