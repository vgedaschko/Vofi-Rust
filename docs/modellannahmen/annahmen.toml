[[annahme]]
id = "MA-012"
titel = "Rendite bei mehreren Einlagen und Entnahmen"
annahme = "Einlagen und Entnahmen werden je Monat saldiert; Entnahmen werden zum Alternativzins nach Steuern auf das Ende des Planungszeitraums aufgezinst und dem Endwert zugerechnet, spätere Einlagen entsprechend dem eingesetzten Eigenkapital."
grund = "Das Lehrbuch definiert die VOFI-Rendite nur für eine einzige Einlage zu Beginn. Für Nachschüsse und Ausschüttungen gibt es mehrere vertretbare Lesarten."
alternative = "Im nachgerechneten Testfall liefern die naheliegenden Lesarten 7,18 %, 7,25 %, 7,50 % und 7,88 %."
grundlage = "Lehrbuchformel nach Grob und Kirchner; die gewählte Lesart bleibt in der Logik der ausdrücklichen Wiederanlage."
quellen = ["KIRCHNER-IWU-2004", "GROB-EINFUEHRUNG"]
gewicht = "hoch"
wirkung = "VOFI-Eigenkapitalrendite jedes Vorhabens mit Eigenkapitaleinsatz über die Bauzeit oder mit laufenden Ausschüttungen."
sichtbar = "kunde"
umschaltbar = false
klaerung = "Fachliteratur: Ropeter (1998), S. 186 ff. (`ROPETER-1998`); fachliche Freigabe durch den Auftraggeber"
wiedervorlage = "mit der Fachspezifikation des Rechenkerns (Phase 1)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 3, Ausschüttungen und Nachschüsse"]
bemerkung = "Die genaue Formel ist in Phase 1 festzulegen und finanzmathematisch nachzurechnen. Am Original bestätigt (`SCHULTE-IMMOBILIENINVESTITION-2025`, S. 816): Das Lehrbuch definiert die VOFI-Rendite nur für eine Einlage zu Beginn und gibt für mehrere Einlagen und Entnahmen keine Formel; die Formel des Projekts ist damit eine eigene Erweiterung. Rechnet die Unterlassensalternative mit zwei Zinssätzen, ist der Vergleichsfaktor neu zu fassen."

