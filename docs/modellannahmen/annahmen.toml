annahme = "Finanzierungskosten einschließlich Bauzeitzinsen gehören nicht zu den zuwendungsfähigen Kosten und sind zusätzlich zu finanzieren."
grund = "Die Richtlinie nennt als Herstellungskosten die Kostengruppen 200 bis 700 nach DIN 276; die Finanzierung ist dort eine eigene Kostengruppe außerhalb dieser Spanne. Die Norm selbst ist nur im Inhaltsverzeichnis gesehen."
alternative = "Finanzierungskosten sind ganz oder teilweise zuwendungsfähig."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 1.5; DIN 276 nur als Sekundärquelle. Angesetzt ist der ungünstigere Fall."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "DIN-276"]
gewicht = "gering"
wirkung = "Höhe von Darlehen und Zuschuss; Finanzierungslücke in der Bauphase."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-11.2, R-11.14"]
bemerkung = "Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): durch die Kostengruppen weitgehend geklärt, Gewicht von mittel auf gering. Der Zuschlag der Kostengruppe 700 im Rechenkern enthält keine Finanzierungskosten (Fachspezifikation R-11.2)."

