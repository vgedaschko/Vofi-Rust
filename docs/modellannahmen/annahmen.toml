[[annahme]]
id = "MA-001"
titel = "Rechenweise der NBank-Renditeprüfung"
annahme = "Das Werkzeug weist die Eigenkapitalrendite für die Überkompensationsprüfung aus dem eigenen Finanzplan des Vorhabens aus und vergleicht sie mit dem 30-Jahres-Swapsatz zuzüglich 100 Basispunkten; Bewirtschaftungskosten, Mietsteigerung, Restwert und Betrachtungszeitraum folgen den Annahmen des Vorhabens."
grund = "Die Richtlinie nennt Verfahren und Schwelle, die NBank veröffentlicht aber weder ihre Rechenannahmen noch ein Rechenblatt."
alternative = "Die NBank rechnet mit eigenen Pauschalen (etwa nach II. BV), ohne Restwert oder über einen festen Zeitraum; dann weicht ihre Rendite von der des Werkzeugs ab."
grundlage = "Richtlinie Mietwohnraum 2026, Nummern 5.3.7 und 11.10."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "hoch"
wirkung = "Aussage, ob die Förderung als angemessen gilt oder gekürzt wird; trägt den Nutzen des Werkzeugs im Fördergeschäft."
sichtbar = "kunde"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, NBank-Renditeprüfung"]
bemerkung = "Bis zur Klärung wird die Kennzahl als eigene Berechnung des Werkzeugs bezeichnet, nicht als Ergebnis der NBank-Prüfung."

