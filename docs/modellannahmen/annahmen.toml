# Kennungen werden fortlaufend vergeben und nie wiederverwendet.

[[annahme]]
id = "MA-001"
titel = "Rechenweise der NBank-Renditeprüfung"
annahme = "Das Werkzeug weist die Eigenkapitalrendite für die Überkompensationsprüfung aus dem eigenen Finanzplan des Vorhabens aus und vergleicht sie mit dem 30-Jahres-Swapsatz zuzüglich 100 Basispunkten; Bewirtschaftungskosten, Mietsteigerung, Restwert und Betrachtungszeitraum folgen den Annahmen des Vorhabens."
grund = "Die Richtlinie nennt Verfahren und Schwelle, die NBank veröffentlicht aber weder ihre Rechenannahmen noch ein Rechenblatt."
alternative = "Die NBank rechnet mit eigenen Pauschalen (etwa nach II. BV), ohne Restwert oder über einen festen Zeitraum; dann weicht ihre Rendite von der des Werkzeugs ab."
grundlage = "Richtlinie Mietwohnraum 2026, Nummern 5.3.7 und 11.10."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "hoch"
wirkung = "Aussage, ob die Förderung als angemessen gilt oder gekürzt wird; trägt den Nutzen des Werkzeugs im Fördergeschäft."
sichtbar = "kunde"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, NBank-Renditeprüfung"]
bemerkung = "Bis zur Klärung wird die Kennzahl als eigene Berechnung des Werkzeugs bezeichnet, nicht als Ergebnis der NBank-Prüfung."

[[annahme]]
id = "MA-002"
titel = "Tilgungsplan des NBank-Darlehens"
annahme = "Das zinslose Darlehen wird in gleichbleibenden Raten im Takt des Rechenrasters getilgt, im Monatsraster also monatlich."
grund = "Beginn und Ende der Tilgung stehen in der Richtlinie: Beginn am Monatsersten nach der vollständigen Auszahlung, spätestens zwei Jahre nach dem Monat, der auf die Förderentscheidung folgt; Rückzahlung längstens 42 Jahre nach Bezugsfertigkeit; Aufschub des Beginns um bis zu fünf Jahre. Offen ist nur die Form der Raten: Die Modalitäten setzt die NBank fest. Nachtrag 2026-11-18: Auch die Produktinformation (Stand 05.11.2026) nennt keinen Tilgungssatz, nur die Rückzahlung nach längstens 42 Jahren. Eine ältere Produktinformation nach den Bestimmungen von 2024 nannte 1,25 % und ab dem Ende der zinslosen Zeit 2,50 %; sie gilt für die Richtlinie 2026 nicht."
alternative = "Jahresraten statt Monatsraten; steigende oder nach Vorgabe der NBank gestaffelte Raten."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 5.3.5."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "gering"
wirkung = "Liquidität innerhalb des Jahres und laufender Beitrag; Endwert nur gering, weil das Darlehen 35 Jahre zinslos ist. Im geförderten Neubau des Referenzfalls: Tilgung ab Monat 23 in 500 Raten von 10.462,98 Euro; Kapitaldienst zu Bemessungskonditionen 151.713,24 Euro im Jahr."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank; im Einzelfall der Bewilligungsbescheid"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-5.11, R-11.14"]
bemerkung = "Prüfrunde 1 zur Fachspezifikation des Rechenkerns (2026-11-18): Annahme auf Raten im Takt des Rasters umgestellt; der frühere Wortlaut nannte Jahresraten, der Kern rechnet im Monatsraster Monatsraten. Fragen an die NBank: Jahres- oder Monatsraten, Beginn mit Vollauszahlung oder Bezugsfertigkeit, Beginn der zinslosen Zeit. Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): Beginn und Ende der Tilgung, Aufschub und zinslose Zeit sind Regel (Fachspezifikation R-5.11) und keine Annahme mehr; die Annahme betrifft nur noch die Form der Raten, Gewicht von mittel auf gering. Der Rechenkern setzt die Förderentscheidung in den Monat vor dem Baubeginn (Festlegung NF-65)."

[[annahme]]
id = "MA-003"
titel = "Zins des NBank-Darlehens ab dem 36. Jahr"
annahme = "Ab dem 36. Jahr wird das Darlehen mit dem Basiszinssatz zuzüglich 3 Prozentpunkten verzinst; den Basiszinssatz der fernen Jahre gibt der Anwender vor."
grund = "Die Regel steht fest: zinslos bis zum Ablauf des 35. Jahres nach Bezugsfertigkeit, danach bis zu drei Prozentpunkte über dem dann gültigen Basiszinssatz, höchstens marktüblich; eine Festschreibung für die Restlaufzeit ist möglich. Offen ist ein künftiger Wert: der Basiszinssatz und der tatsächliche Aufschlag in den Jahren 36 bis 42."
alternative = "Geringerer Aufschlag oder Fortführung zinslos."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 5.3.4; Basiszinssatz nach § 247 BGB. Angesetzt ist der ungünstigste zulässige Fall."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "BGB-247"]
gewicht = "gering"
wirkung = "Zinsaufwand der Jahre 36 bis 42 auf die Restschuld."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 3, Zeithorizont", "Fachspezifikation Rechenkern, R-5.8, R-5.11, R-11.14"]
bemerkung = "Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): Die Annahme betrifft einen künftigen Wert, nicht die Regel."

[[annahme]]
id = "MA-004"
titel = "KfW-Darlehen als Ersatz für Eigenmittel bei der NBank"
annahme = "Ein KfW-Darlehen zählt nicht als Eigenmittel; die geforderten 20 % sind aus Eigenkapital aufzubringen."
grund = "Die Richtlinie verlangt Eigenmittel von mindestens 20 % der zuwendungsfähigen Kosten (Geld, Eigenleistungen, Wert des lastenfreien Grundstücks; mindestens die Hälfte Geld oder Grundstück) und kennt „als Ersatz der Eigenmittel anerkannte Fremdmittel“. Eine Anerkennung ist also möglich; unter welchen Voraussetzungen, steht nicht da."
alternative = "Die NBank erkennt ein KfW-Darlehen oder andere Fremdmittel ganz oder teilweise als Eigenmittelersatz an; sie stehen dann im Rang nach dem Förderdarlehen."
grundlage = "Richtlinie Mietwohnraum 2026, Nummern 5.2.6, 11.4 und 11.5; Antragsvordruck mit eigener Zeile für KfW-Darlehen. Angesetzt ist der ungünstigere Fall."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "NBANK-VORDRUCK-1011"]
gewicht = "hoch"
wirkung = "Eigenkapitalbedarf und damit Eigenkapitalrendite und Finanzierbarkeit des Vorhabens."
sichtbar = "kunde"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-5.12, R-11.14"]
bemerkung = "Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): Die Anerkennung von Fremdmitteln als Eigenmittelersatz ist nach Nummer 11.5 möglich; offen sind nur noch die Voraussetzungen. Die vorsichtige Voreinstellung bleibt bis zum Gespräch mit der NBank."

[[annahme]]
id = "MA-005"
titel = "Finanzierungskosten als zuwendungsfähige Kosten der NBank"
annahme = "Finanzierungskosten einschließlich Bauzeitzinsen gehören nicht zu den zuwendungsfähigen Kosten und sind zusätzlich zu finanzieren."
grund = "Die Richtlinie nennt als Herstellungskosten die Kostengruppen 200 bis 700 nach DIN 276; die Finanzierung ist dort eine eigene Kostengruppe außerhalb dieser Spanne. Die Norm selbst ist nur im Inhaltsverzeichnis gesehen."
alternative = "Finanzierungskosten sind ganz oder teilweise zuwendungsfähig."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 1.5; DIN 276 nur als Sekundärquelle. Angesetzt ist der ungünstigere Fall. Die Produktinformation (Stand 05.11.2026) nennt als zuwendungsfähig die Herstellungskosten der Kostengruppen 200 bis 700 und die Grundstückskosten der Kostengruppe 100; Finanzierungskosten nennt sie nicht."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "DIN-276"]
gewicht = "gering"
wirkung = "Höhe von Darlehen und Zuschuss; Finanzierungslücke in der Bauphase."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-11.2, R-11.14"]
bemerkung = "Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): durch die Kostengruppen weitgehend geklärt, Gewicht von mittel auf gering. Der Zuschlag der Kostengruppe 700 im Rechenkern enthält keine Finanzierungskosten (Fachspezifikation R-11.2)."

[[annahme]]
id = "MA-006"
titel = "Aufteilung bei teilgeförderten Vorhaben"
annahme = "Kosten und Finanzierung werden innerhalb des Wohnens nach Wohnfläche auf geförderte Einkommensgruppen und frei finanzierte Wohnungen aufgeteilt, zwischen Wohnen und Gewerbe nach umbautem Raum; gemeinsame Erträge nach Wohnfläche. Einzeln zurechenbare Kosten werden nicht vorab zugeordnet."
grund = "Der Schlüssel ergibt sich aus der Arbeitsmappe der NBank. Offen ist nur, ob einzeln zurechenbare Kosten vorab zugeordnet werden dürfen."
alternative = "Kosten, die sich einzelnen Wohnungen eindeutig zurechnen lassen, werden vorab zugeordnet; nur der Rest wird nach dem Schlüssel verteilt."
grundlage = "NBank-Arbeitsmappe „Kosten-Finanzierungsaufteilung“, Blatt 1, Zeilen 11 bis 41 (gelesen 2026-11-18): Wohnflächenanteil mal Anteil des umbauten Raums."
quellen = ["NBANK-KOSTEN-FINANZIERUNGSAUFTEILUNG"]
gewicht = "gering"
wirkung = "Zuwendungsfähige Kosten des geförderten Teils und damit Förderhöhe; Rendite je Teil."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage"]
bemerkung = "Am 2026-11-18 nach Quellnotiz 13 genauer gefasst; Gewicht von mittel auf gering."

[[annahme]]
id = "MA-007"
titel = "Dauer des Drittmittelabzugs bei Mieterhöhungen auf die Vergleichsmiete"
annahme = "Fördermittel mindern Mieterhöhungen auf die ortsübliche Vergleichsmiete für zwölf Jahre ab der mittleren Bezugsfertigkeit der geförderten Maßnahme."
grund = "Der Bundesgerichtshof begrenzt die Anrechnung auf zwölf Jahre und leitet die Frist aus dem damaligen Umlagesatz von 11 % ab. Ob sie beim heutigen Satz von 8 % unverändert gilt, ist nicht entschieden."
alternative = "Länger als zwölf Jahre, weil sich der Zuschuss beim Umlagesatz von 8 % später aufzehrt; im strengsten Fall über den gesamten Betrachtungszeitraum (frühere Voreinstellung)."
grundlage = "§ 558 Abs. 5 in Verbindung mit § 559a BGB; BGH vom 13.06.2012, VIII ZR 311/11, Rn. 20 bis 27 (Wortlaut in nichtamtlicher Sammlung gelesen, Quellnotiz 15): zwölf Jahre ab mittlerer Bezugsfertigkeit; eine längere vertragliche Bindung verlängert die Anrechnung nicht. Die Voreinstellung folgt der Rechtsprechung und ist nicht mehr die strengste Lesart; als begründete Ausnahme von der Vorsichtsregel gekennzeichnet."
quellen = ["BGB-558", "BGB-559A", "BGH-VIII-ZR-311-11"]
gewicht = "mittel"
wirkung = "Mietpfad geförderter Sanierungen nach der ersten Erhöhung; Endwert und Rendite."
sichtbar = "kunde"
umschaltbar = true
klaerung = "Anwalt (nur noch: gilt die Frist von zwölf Jahren beim Umlagesatz von 8 % fort?)"
wiedervorlage = "mit der Rechtsprüfung vor dem Kundeneinsatz"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Kopplungen"]
bemerkung = "Am 2026-11-18 nach Quellnotiz 15 von „gesamter Betrachtungszeitraum“ auf zwölf Jahre umgestellt."

[[annahme]]
id = "MA-008"
titel = "Modernisierungsumlage für den Heizungstausch bei Staffelmiete"
annahme = "Bei vereinbarter Staffelmiete ist während der Laufzeit der Staffeln keine Umlage für den Heizungstausch möglich."
grund = "Der Ausschluss von Mieterhöhungen bei Staffelmiete nennt die neue Umlage für den Heizungstausch nicht ausdrücklich; ob er sie erfasst, ist offen."
alternative = "Die Umlage nach § 559e BGB ist neben der Staffelmiete zulässig."
grundlage = "§ 557a BGB und § 559e BGB. Angesetzt ist der für den Vermieter ungünstigere Fall. Am Wortlaut gelesen (2026-11-18): § 557a Abs. 2 Satz 2 BGB schließt nur Erhöhungen „nach den §§ 558 bis 559b“ aus; § 559e liegt außerhalb, und § 559e Abs. 4 verweist nicht auf § 557a. Das spricht für die andere Lesart; die vorsichtige Voreinstellung bleibt bis zur Rechtsprüfung."
quellen = ["BGB-557A", "BGB-559E"]
gewicht = "gering"
wirkung = "Mieterlös nach Heizungstausch in Wohnungen mit Staffelmiete; gedeckelt auf 0,50 €/m² im Monat."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Anwalt"
wiedervorlage = "mit der Rechtsprüfung vor dem Kundeneinsatz"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regel- und Förderkatalog"]
bemerkung = ""

