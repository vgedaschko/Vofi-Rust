grund = "Die Regel steht fest: zinslos bis zum Ablauf des 35. Jahres nach Bezugsfertigkeit, danach bis zu drei Prozentpunkte über dem dann gültigen Basiszinssatz, höchstens marktüblich; eine Festschreibung für die Restlaufzeit ist möglich. Offen ist ein künftiger Wert: der Basiszinssatz und der tatsächliche Aufschlag in den Jahren 36 bis 42."
alternative = "Geringerer Aufschlag oder Fortführung zinslos."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 5.3.4; Basiszinssatz nach § 247 BGB. Angesetzt ist der ungünstigste zulässige Fall."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "BGB-247"]
