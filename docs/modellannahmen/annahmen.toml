[[annahme]]
id = "MA-016"
titel = "Verrechnung von Anlaufverlusten"
annahme = "Steuerliche Verluste des Vorhabens werden im Vorhaben vorgetragen und erst mit dessen späteren Gewinnen verrechnet. Das Modell nimmt damit an, dass der Investor im Verlustjahr keine anderen Gewinne derselben Steuerart im selben Steuersubjekt hat, mit denen er den Verlust verrechnen könnte."
grund = "Ob ein Verlust sofort mit anderen Einkünften des Investors verrechnet werden kann, hängt von dessen übriger steuerlicher Lage ab, die das Werkzeug nicht kennt."
alternative = "Sofortige Verrechnung: Der Investor hat im selben Jahr genug andere Gewinne derselben Steuerart im selben Steuersubjekt (Körperschaft oder Organkreis, Betrieb, andere Einkünfte der Privatperson); die Steuerersparnis fließt im Verlustjahr zu. Das Vorhaben gilt dann als Teil eines größeren Steuersubjekts: Freibetrag und Abrundung der Gewerbesteuer und der Freibetrag der Hinzurechnung gelten als verbraucht. Bei der Personengesellschaft gilt die Lesart nur für die Einkommensteuer; ihr Fehlbetrag der Gewerbesteuer wird immer vorgetragen. Bei Kommanditisten gilt die sofortige Verrechnung nur, soweit kein negatives Kapitalkonto entsteht oder sich erhöht (§ 15a EStG); die Steuer in Kurzform prüft das nicht."
grundlage = "Verlustabzug nach § 10d EStG; Gewerbeverlust nach § 10a GewStG. Voreingestellt ist der Vortrag, weil das Werkzeug die übrige steuerliche Lage des Investors nicht kennt. Welche Lesart das Vorhaben günstiger rechnet, hängt vom Fall ab: Meist ist es die sofortige Verrechnung; im Ankauf des Referenzfalls ergibt sie 4,523 % gegen 4,527 % mit Vortrag, weil der Freibetrag der Hinzurechnung bei ihr als verbraucht gilt."
quellen = ["ESTG-10D", "GEWSTG-10A", "ESTG-15A"]
gewicht = "hoch"
wirkung = "Wert der beschleunigten Abschreibung und der Anlaufverluste im Neubau; Endwert und Rendite nach Steuern."
sichtbar = "kunde"
umschaltbar = true
klaerung = "Haus (Katalog des Hauses); im Zweifel Steuerberater des Investors"
wiedervorlage = "mit der Fachspezifikation des Steuermoduls (Phase 1)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 1, Steuerstatus", "Fachspezifikation Rechenkern, R-7.5, R-7.6, Hauswert H-38"]
bemerkung = "Aus Prüfrunde 3 (Fachexperte). Wird als Merkmal je Vorhaben geführt. Prüfrunde 1 zur Fachspezifikation des Rechenkerns (2026-11-18, Steuerberater): Annahme über andere Gewinne ausdrücklich genannt; bei der Personengesellschaft keine sofortige Erstattung der Gewerbesteuer. Die Kurzform verrechnet Vorträge unbeschränkt; ein Vortrag über dem Sockelbetrag löst einen Hinweis aus (MA-010). Prüfrunde 2 zur Fachspezifikation des Rechenkerns (2026-11-18), Steuerberater: Grenze des § 15a EStG bei Kommanditisten ergänzt; gerechnet wird sie erst in der Steuer in Grundform. Beim Einzelunternehmen rechnet die sofortige Verrechnung die Gewerbesteuer ohne Begrenzung auf die Einkommensteuer des Vorhabens an. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Die Verlustverrechnung ist keine Eingabe des Vorhabens mehr (E-44 entfallen), sondern fester Hauswert H-38 mit der Voreinstellung Vortrag; umschaltbar heißt hier: als Wert des Hauses im Katalog. Gemessene Wirkung von „sofort“: höchstens rund 0,1 Prozentpunkte Rendite (Privatperson im Ankauf), bei der Körperschaft unter 0,04."

[[annahme]]
id = "MA-017"
titel = "Restwert bei laufender Bindung"
annahme = "Endet der Betrachtungszeitraum vor dem Ende der Bindung, löst der Verkäufer das zinslose Förderdarlehen ab und zahlt den Zuschuss anteilig zurück; der Verkaufswert wird aus der gebundenen Miete abgeleitet. Ein Käufer übernimmt Darlehen und Bindung nicht."
grund = "Rückzahlung und Nachwirkung der Bindung stehen in der Richtlinie: Bei freiwilliger vollständiger Rückzahlung ist der Anteil des Zuschusses zurückzuzahlen, der auf die verbleibende Bindungsdauer entfällt, und die Bindungen wirken nach. Zur Übernahme von Darlehen und Bindung durch einen Käufer sagt die Richtlinie nichts. Nachtrag 2026-11-18 (Quellnotiz 13): Die Bindungen treffen kraft Gesetzes jeden Verfügungsberechtigten, also auch einen Käufer (§ 9 Abs. 1, § 10 NWoFG). Für den Eigentümer- und Schuldnerwechsel sieht die NBank eine Zustimmung gegen Entgelt vor (Entgeltkatalog Nr. 3: 0,5 % der Restschuld, 100 bis 1.500 Euro). Offen ist, unter welchen Voraussetzungen sie zustimmt und ob der Käufer das Darlehen zu unveränderten Bedingungen übernimmt."
alternative = "Der Käufer übernimmt Darlehen und Bindung; der Vorteil des zinslosen Darlehens geht dann in den Kaufpreis ein."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 5.4.6. Angesetzt ist der ungünstigere Fall."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "NWOFG-9", "NWOFG-10", "NBANK-ENTGELTKATALOG"]
gewicht = "mittel"
wirkung = "Restwert und Endwert geförderter Vorhaben mit Verkauf vor Bindungsende."
sichtbar = "kunde"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Spezifikation Kapitel 3, Restwert", "Fachspezifikation Rechenkern, R-8.7, R-8.8, R-11.14"]
bemerkung = "Aus Prüfrunde 3 (Fachexperte, Jurist). Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): Rückzahlung des Zuschusses und Ende der Bindung sind geklärt; offen bleibt die Übernahme durch einen Käufer. Der Rechenkern rechnet die Rückzahlung zeitanteilig nach Perioden (Fachspezifikation R-8.7)."

[[annahme]]
id = "MA-018"
titel = "Ersatz eines Gaskessels als energetische Modernisierung"
annahme = "Der Ersatz eines Gaskessels durch einen neuen Gas- oder Ölkessel gilt nicht als energetische Modernisierung; ohne Förderfähigkeit wird keine Modernisierungsumlage angesetzt."
grund = "Ob der bloße Kesseltausch Endenergie nachhaltig einspart und damit die allgemeine Umlage eröffnet, ist eine Auslegungsfrage des Einzelfalls."
alternative = "Der Tausch gilt als energetische Modernisierung; dann ist die allgemeine Umlage von 8 % möglich."
grundlage = "§ 555b Nr. 1 und § 559 BGB. Angesetzt ist der für den Vermieter ungünstigere Fall. BGH vom 26.03.2025, VIII ZR 283/23, Rn. 31 (Quellnotiz 15): Die Erneuerung des Heizkessels kann Endenergie einsparen; die Umlage setzt eine zum Zeitpunkt der Erklärung erwartbare, messbare und dauerhafte Einsparung voraus, und der Erhaltungsanteil ist abzuziehen. Die vorsichtige Voreinstellung bleibt, weil das Modell die Einsparung nicht prüfen kann; die andere Lesart wird als Eingabe „Einsparung nachgewiesen“ mit Erhaltungsanteil geführt."
quellen = ["BGB-555B", "BGB-559", "BGH-VIII-ZR-283-23"]
gewicht = "gering"
wirkung = "Mieterlös nach Kesseltausch ohne Förderung."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Anwalt"
wiedervorlage = "mit der Rechtsprüfung vor dem Kundeneinsatz"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regel- und Förderkatalog"]
bemerkung = "Aus Prüfrunde 3 (Jurist)."

[[annahme]]
id = "MA-019"
titel = "Zinsverbilligte Darlehen bei der Umlage für den Heizungstausch"
annahme = "Der Zinsvorteil eines zinsverbilligten Darlehens mindert die Umlage für den Heizungstausch in gleicher Weise wie bei der allgemeinen Modernisierungsumlage."
grund = "Die Vorschrift zum Heizungstausch spricht vom Abzug der in Anspruch genommenen Drittmittel; wie ein Zinsvorteil dabei anzusetzen ist, regelt sie nicht ausdrücklich."
alternative = "Strenger: Das Darlehen wird wie ein Zuschuss mit seinem Nennbetrag von den Kosten abgezogen; dafür spricht der Wortlaut, der den Abzug an den Kosten ansetzt. Günstiger für den Vermieter: Nur Zuschüsse werden abgezogen; der Zinsvorteil bleibt unberücksichtigt."
grundlage = "§ 559e Abs. 1 in Verbindung mit § 559a BGB. Begründete Ausnahme von der Vorsichtsregel: Angesetzt ist nicht die strengste Lesart (Nennbetrag), sondern der Zinsvorteil. Dafür spricht die Systematik: § 559e Abs. 1 nimmt für die Drittmittel auf § 559a Bezug, und dessen Absatz 2 erfasst Darlehen über den Zinsvorteil; ein Darlehen ist zurückzuzahlen. Der Unterschied wirkt selten, weil meist die Kappung bindet."
quellen = ["BGB-559E", "BGB-559A"]
gewicht = "gering"
wirkung = "Mieterlös nach gefördertem Heizungstausch; gedeckelt auf 0,50 €/m² im Monat."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Anwalt"
wiedervorlage = "mit der Rechtsprüfung vor dem Kundeneinsatz"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Kopplungen"]
bemerkung = "Aus Prüfrunde 3 (Jurist); Lesart „Nennbetrag“ und Einordnung als Ausnahme von der Vorsichtsregel aus Prüfrunde 4 (Jurist); Bezeichnung in Prüfrunde 5 vereinheitlicht."

[[annahme]]
id = "MA-020"
titel = "Umlage für den Heizungstausch in der NBank-Bindung"
annahme = "Während der Mietbindung der NBank wird keine Umlage für den Heizungstausch angesetzt."
grund = "Die Richtlinie lässt Mieterhöhungen in der Bindung nach bestimmten Vorschriften zu und nennt die neue Umlage für den Heizungstausch dabei nicht."
alternative = "Die Umlage ist auch in der Bindung zulässig, soweit die Höchstmiete eingehalten wird."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 5.4.5. Angesetzt ist der für den Vermieter ungünstigere Fall. Am Wortlaut gelesen (2026-11-18): § 9 Abs. 1 Satz 3 NWoFG lässt Erhöhungen in den Grenzen der Förderentscheidung nach den allgemeinen mietrechtlichen Vorschriften zu, ohne Paragrafen aufzuzählen. Das Gesetz stützt die andere Lesart; die Höchstmiete begrenzt in jedem Fall."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "BGB-559E", "NWOFG-9"]
gewicht = "gering"
wirkung = "Mieterlös gebundener Wohnungen nach Heizungstausch."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage"]
bemerkung = "Aus Prüfrunde 3 (Jurist)."

[[annahme]]
id = "MA-021"
titel = "Nicht abziehbare Vorsteuer als zuwendungsfähige Kosten der NBank"
annahme = "Kann der Bauherr die Vorsteuer nicht abziehen, zählt die Umsatzsteuer zu den zuwendungsfähigen Kosten."
grund = "Die Richtlinie regelt die Behandlung der Umsatzsteuer nicht ausdrücklich. Der Verwendungsnachweis der NBank setzt voraus, dass nicht abziehbare Umsatzsteuer zuwendungsfähig ist; eine ausdrückliche Bestätigung der NBank steht aus, und die ANBest-P, auf die die Richtlinie verweist, sind noch nicht gelesen."
alternative = "Zuwendungsfähig sind nur die Nettokosten; die Umsatzsteuer ist zusätzlich zu finanzieren."
grundlage = "NBank, Vordruck 4009 „Einfacher Verwendungsnachweis“ (Stand Juli 2026), Nummer 5.4, vom Juristen am 18.11.2026 gelesen: Der Zuwendungsempfänger erklärt, dass die zuwendungsfähigen Ausgaben keine Umsatzsteuer enthalten, soweit sie nach § 15 UStG als Vorsteuer abziehbar ist. Das setzt voraus, dass nicht abziehbare Umsatzsteuer zuwendungsfähig ist. Die Richtlinie verweist in Nummer 12.5 für den Verwendungsnachweis auf Nummer 6 ANBest-P. Die Voreinstellung ist damit die am Text gestützte Lesart und keine Ausnahme von der Vorsichtsregel. Die andere Lesart senkte die Förderung auf die Baukosten um bis zu einem Sechstel (19/119 der Bruttokosten), weniger, wenn die Bemessungsgrenze kappt; die umsatzsteuerfreien Grundstückskosten berührt sie nicht."
quellen = ["NBANK-VORDRUCK-4009", "NBANK-RL-MIETWOHNRAUM-2026", "NI-ANBEST-P"]
gewicht = "gering"
wirkung = "Höhe von Darlehen und Zuschuss; Finanzierungslücke."
sichtbar = "anwender"
umschaltbar = true
klaerung = "geklärt am Text des niedersächsischen Haushaltsrechts"
wiedervorlage = "mit der nächsten vierteljährlichen Rechtsprüfung"
status = "bestaetigt"
gesetzt_am = "2026-11-18"
erledigt_am = "2026-11-18"
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage"]
bemerkung = "Aus der dritten Überarbeitung des Rechercheberichts; Größe der Wirkung und Klärungsweg nach Prüfrunde 4 (Finanzmathematiker, Jurist) berichtigt. Prüfrunde 5 (Jurist): Grundlage ist jetzt der Vordruck 4009; Gewicht von mittel auf gering gesetzt, die Einordnung als Ausnahme von der Vorsichtsregel entfällt. Bestätigt am 2026-11-18 durch VV Nr. 2.6 zu § 44 LHO und Nr. 6.4 ANBest-P (`NI-ANBEST-P`, Quellnotiz 13): Nur die nach § 15 UStG abziehbare Vorsteuer gehört nicht zu den zuwendungsfähigen Ausgaben. Die Bestätigung durch die NBank entfällt."

[[annahme]]
id = "MA-022"
titel = "Leerstand beim Mieterwechsel und Sonderabschreibung"
annahme = "Ein Leerstand zwischen zwei Mietverhältnissen schadet der Sonderabschreibung nicht, solange die Vermietungsabsicht fortbesteht. Schädlich bleiben Selbstnutzung, unentgeltliche Überlassung, vorübergehende Beherbergung und die Aufgabe der Vermietungsabsicht."
grund = "Das Gesetz verlangt, dass die Wohnung der entgeltlichen Überlassung zu Wohnzwecken dient; ob das einen Leerstand beim Mieterwechsel einschließt, ergibt sich aus der Verwaltungsauffassung, die nicht gelesen ist."
alternative = "Jeder Leerstand im Nutzungszeitraum nach § 7b, dem Jahr der Anschaffung oder Herstellung und den neun folgenden Jahren, löst die rückwirkende Versagung der Sonderabschreibung aus."
grundlage = "BMF-Schreiben vom 21.05.2025 zu § 7b EStG, Rn. 33: Eine Wohnung dient der entgeltlichen Überlassung auch, wenn sie vorübergehend leer steht, die Überlassung aber weiterhin vorgesehen ist und die Wohnung dafür bereitgehalten wird. Schädlich bleiben Selbstnutzung und unentgeltliche Überlassung (Rn. 32) sowie die vorübergehende Beherbergung (Rn. 36). Verwaltungsauffassung; die Finanzverwaltung ist daran gebunden."
quellen = ["ESTG-7B", "BMF-7B-2025"]
gewicht = "mittel"
wirkung = "Steuerzahlungen im Neubau mit Sonderabschreibung; Ergebnis im Stressfall Leerstand."
sichtbar = "anwender"
umschaltbar = true
klaerung = "geklärt am Anwendungsschreiben der Finanzverwaltung"
wiedervorlage = "bei Neufassung des Anwendungsschreibens"
status = "bestaetigt"
gesetzt_am = "2026-11-18"
erledigt_am = "2026-11-18"
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage"]
bemerkung = "Aus Prüfrunde 3 (Jurist) und der dritten Überarbeitung des Rechercheberichts; schädliche Nutzungen und Begriff „Nutzungszeitraum“ aus Prüfrunde 4 (Jurist). Bestätigt am 2026-11-18 (Quellnotiz 13). Die Voreinstellung ist damit keine Ausnahme von der Vorsichtsregel mehr."

[[annahme]]
id = "MA-023"
titel = "Kostenbasis der Baukostenobergrenze der Sonderabschreibung"
annahme = "Die Baukostenobergrenze der Sonderabschreibung wird an den abschreibungsfähigen Anschaffungs- oder Herstellungskosten des Gebäudes gemessen: ohne Grund und Boden, ohne Erschließung außerhalb des Grundstücks, ohne Möblierung und ohne Finanzierungskosten, mit Hausanschlüssen und Baunebenkosten. Von den Außenanlagen zählt nur die Einfriedung des Wohngrundstücks; Gartenanlagen, Wege, Hofbefestigung und Zufahrten zählen nicht. Geteilt wird durch die Nutzfläche des ganzen Gebäudes einschließlich Nebenräumen und Garagen, wahlweise durch die Bruttogrundfläche. Beim Erwerb zählt der Gebäudeanteil des Kaufpreises nach der Kaufpreisaufteilung zuzüglich der anteiligen Erwerbsnebenkosten."
grund = "Kostenbegriff, Flächenmaß und Außenanlagen sind durch die Verwaltungsauffassung geklärt. Im Modell liegt die Kostengruppe 500 meist nur als Summe vor: Sie zählt nicht zur Kostenbasis; Einfriedungen gibt der Anwender gesondert an."
alternative = "Die Kostengruppe 500 zählt ganz mit (strenger, ohne Stütze in der Verwaltungsauffassung)."
grundlage = "BMF-Schreiben vom 21.05.2025 zu § 7b EStG: abschreibungsfähige Kosten nach § 255 HGB (Rn. 38, 41), Grund und Boden und Erschließung außerhalb des Grundstücks zählen nicht, Hausanschlüsse zählen (Rn. 42, 43), Möblierung zählt nicht (Rn. 46), Kaufpreisaufteilung beim Erwerb (Rn. 47), Nutzfläche des ganzen Gebäudes oder Bruttogrundfläche nach DIN 277 (Rn. 49 bis 51); bei Überschreitung entfällt die Sonderabschreibung ganz (Rn. 48). Außenanlagen: Rn. 45 verweist auf R 21.1 Abs. 3 Satz 1 EStR – von der Gartengestaltung gehört nur die „lebende Umzäunung“ zum Gebäude, im Übrigen ist die Gartenanlage ein eigenes Wirtschaftsgut; die Umzäunung eines Mietwohngrundstücks gehört in der Regel zum Gebäude (H 6.4, H 7.1 EStH; Wortlaut in Verlagswiedergabe, Quellnotiz 15). Bis 2026-11-18 war bei Herstellung die Kostensumme der NBank-Förderung (Kostengruppen 200 bis 700) geteilt durch die Wohnfläche angesetzt; das war beim Kostenbegriff nahe am Ergebnis, beim Flächenmaß zu streng."
quellen = ["ESTG-7B", "BMF-7B-2025", "ESTR-21-1", "ESTH-6-4-7-1"]
gewicht = "gering"
wirkung = "Ob die Sonderabschreibung überhaupt gewährt wird; die Grenze ist eine Ausschlussgrenze."
sichtbar = "anwender"
umschaltbar = true
klaerung = "geklärt am Anwendungsschreiben der Finanzverwaltung und an den Einkommensteuer-Richtlinien"
wiedervorlage = "bei Neufassung des Anwendungsschreibens"
status = "bestaetigt"
gesetzt_am = "2026-11-18"
erledigt_am = "2026-11-18"
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage"]
bemerkung = "Aus Prüfrunde 3 (Fachexperte) und der dritten Überarbeitung des Rechercheberichts; Ersterwerb aus Prüfrunde 4 (Jurist). Prüfrunde 5 (Jurist): beim Erwerb Gebäudeanteil statt Kaufpreis einschließlich Boden, ohne Marktwertdeckel. Offen bleibt, welche Gebäudekosten im Einzelnen zählen, etwa Außenanlagen. Am 2026-11-18 nach den Quellnotizen 13 und 15 neu gefasst und geschlossen. Die Wohnfläche bleibt Maßstab für den Deckel der Bemessungsgrundlage (BMF Rn. 59, 60), nicht für die Obergrenze."

[[annahme]]
id = "MA-024"
titel = "Zeitlicher Anwendungsbereich des Wärmepumpen-Nachweises"
annahme = "Für eine eingebaute Wärmepumpe ist der Nachweis der Jahresarbeitszahl erforderlich, außer in den Fällen des § 559f Abs. 1 Satz 2 Nr. 1 bis 4 BGB (Gebäude nach 1996 errichtet, nach der Wärmeschutzverordnung 1995 gebaut, nach einer Sanierung mindestens auf dem Stand des § 38 Gebäudemodernisierungsgesetz oder mit höchstens 55 °C Vorlauftemperatur beheizbar); ohne Nachweis wird nur die Hälfte der Kosten umgelegt. Im Neubau greift die Halbierung nicht."
grund = "Eine Übergangsvorschrift zu §§ 559e, 559f BGB nennt die Inhaltsübersicht von Art. 229 EGBGB nicht; die Einzelvorschriften sind nicht gelesen. Ob ein Ausnahmefall vorliegt, gibt der Anwender je Vorhaben an."
alternative = "Die Vorschrift gilt nur für bestimmte Zeiträume; außerhalb ist die volle Umlage ohne Nachweis möglich."
grundlage = "§ 559f BGB. Angesetzt ist der für den Vermieter ungünstigere Fall."
quellen = ["BGB-559F", "EGBGB-ART-229"]
gewicht = "gering"
wirkung = "Mieterlös nach Einbau einer Wärmepumpe."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Anwalt"
wiedervorlage = "mit der Rechtsprüfung vor dem Kundeneinsatz"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage"]
bemerkung = "Aus der dritten Überarbeitung des Rechercheberichts. Am 2026-11-18 nach Quellnotiz 13 um die gesetzlichen Ausnahmen ergänzt."

[[annahme]]
id = "MA-025"
titel = "Modernisierungsumlage für den Glasfaseranschluss"
annahme = "Für den erstmaligen Glasfaseranschluss wird keine Modernisierungsumlage angesetzt."
grund = "Der Wortlaut steht in Spannung: § 559 Abs. 1 Satz 1 BGB nennt die Maßnahmen nach § 555b Nr. 1, 3, 4, 5 und 6, nicht Nr. 4a; Satz 2 regelt aber, wann die Erhöhung im Fall der Nr. 4a zulässig ist, und setzt ihre Umlage damit voraus."
alternative = "Nr. 4a ist umlagefähig, über Satz 2 oder weil der Anschluss den Gebrauchswert nach Nr. 4 erhöht: 8 % der Kosten, wenn der Mieter seinen Anbieter frei wählen kann und kein Bereitstellungsentgelt als Betriebskosten umgelegt wird oder wurde."
grundlage = "§ 555b Nr. 4a und § 559 Abs. 1 Satz 2 BGB. Angesetzt ist der für den Vermieter ungünstigere Fall."
quellen = ["BGB-555B", "BGB-559"]
gewicht = "gering"
wirkung = "Mieterlös nach Glasfaserausbau."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Anwalt"
wiedervorlage = "mit der Rechtsprüfung vor dem Kundeneinsatz"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage"]
bemerkung = "Aus Prüfrunde 3 (Jurist); Grund und andere Lesart nach Prüfrunde 4 (Jurist) neu gefasst. Frage an den Anwalt: Ist Nr. 4a über § 559 Abs. 1 Satz 2 oder über Nr. 4 umlagefähig?"

[[annahme]]
id = "MA-026"
titel = "Rechengrundlage des Bankdarlehens"
annahme = "Offen ist an der Rechnung der Bank fünferlei. (1) Beleihungsquote: Die Bank rechnet ihre Quote über alle Darlehen, auch über das Förderdarlehen der Grobförderung, obwohl es nach der Richtlinie im Rang nach den Bankmitteln steht, und über das durchgeleitete KfW-Darlehen; für ein übernommenes Darlehen ist der Rang Eingabe. (2) Kapitaldienst: Die Bank rechnet ihr eigenes Darlehen mit dem höheren aus Vertragszins und kalkulatorischem Zins. Darlehen anderer Geber mit fester Kondition (KfW, NBank, übernommene Darlehen) rechnet sie über den Bemessungszeitraum – eine Vorgabe des Hauses, voreingestellt die Zinsbindung des Bankdarlehens – mit dem zeitgewichteten Mittel aus Vertragszins bis zum Ende ihrer Zinsbindung und kalkulatorischem Zins danach; die Tilgung mindestens mit der Mindesttilgung. (3) Ertrag: Die Bank setzt den nachhaltigen Reinertrag an, beim Ankauf den kleineren aus Miete und Vergleichsmiete, mit Bewirtschaftungskosten mindestens in Höhe des Mindestansatzes. (4) Im Neubau gilt als nachhaltige Miete die Miete bei Bezug. (5) Wertansatz: Kaufpreis, beim Neubau die Gesamtkosten."
grund = "Wie eine Bank Kapitaldienstfähigkeit und Beleihung im Einzelfall rechnet, ist nicht veröffentlicht und von Haus zu Haus verschieden: mit welchem Ertrag, ob vorrangige und geförderte Darlehen auf Quote und Deckung angerechnet werden und auf welchen Wert."
alternative = "(1) Die Bank rechnet ihre Quote nur über vor- und gleichrangige Darlehen; das Förderdarlehen belegt den Beleihungsraum dann nicht. (2) Die Bank rechnet mit den Vertragskonditionen. (3) Sie setzt Ertrag und Bewirtschaftung des Vorhabens an. (4) Sie rechnet auch die Darlehen anderer Geber durchgehend mit ihrem kalkulatorischen Zins. Diese vier sind umschaltbar; (1) bis (3) lassen das Bankdarlehen höher ausfallen, (4) niedriger. (5) Sie setzt im Neubau eine niedrigere nachhaltige Miete an (Eingabe). (6) Sie setzt einen Beleihungswert unter dem Kaufpreis an (Eingabe)."
grundlage = "Gegenrechnungen der Prüfrunden 4 und 5 zum Recherchebericht und der Prüfrunden 1 und 2 zur Fachspezifikation des Rechenkerns (Rollen Bank und Praktiker). Bewirtschaftungsansatz nach der Beleihungswertermittlungsverordnung. Rang des Förderdarlehens: Richtlinie Mietwohnraum 2026, Nummern 5.3.6 und 11.5; der Rang ist damit Regel, Annahme ist nur, ob die Bank ihre Quote trotzdem über alle Darlehen rechnet. Drei gekennzeichnete Ausnahmen von der Vorsichtsregel: der Bemessungszins fremder Tranchen (vorsichtiger wäre Lesart 4; sie ließ dem KfW-Darlehen keinen Bemessungsvorteil und erzeugte eine Klippe, wenn ein übernommenes Darlehen kurz vor dem Bankdarlehen aus der Bindung läuft), der Wertansatz (Kaufpreis statt eines niedrigeren Beleihungswerts) und die nachhaltige Miete im Neubau (der Kern kennt dort keinen Mietspiegelwert). Das Anschlussrisiko zeigt daneben die kleinste Deckung über die Haltedauer."
quellen = ["BELWERTV-11", "NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "hoch"
wirkung = "Höhe des Bankdarlehens und damit höchster tragbarer Preis, nötiges Eigenkapital und Rendite in der Grobkalkulation. Ankauf des Referenzfalls: Bankdarlehen 1.226.609,99 Euro; höchster tragbarer Preis 2.317.235 Euro gegen 2.359.366 Euro mit Vertragskonditionen (Lesart 2). Gebundener Bestand mit übernommenem Darlehen: Bankdarlehen 843.802,85 Euro mit dem Bemessungszins gegen 672.374,28 Euro nach Lesart 4. Neubau mit KfW-Darlehen von 3 Mio. Euro: tragbarer Grundstückspreis 1.197.094 Euro gegen 920.435 Euro nach Lesart 4 und 1.283.299 Euro nach Lesart 2. Im geförderten Neubau bleibt nach jeder Lesart kein Bankdarlehen, weil die Deckung bindet."
sichtbar = "kunde"
umschaltbar = true
klaerung = "Hausbank (zehn Fragen in der Fachspezifikation des Rechenkerns, Kapitel 16); die Schwellen selbst (Beleihungsquote, Mindestdeckung, Mindesttilgung, kalkulatorischer Zins je Tranchenart, Bemessungszeitraum, Mindestansatz der Bewirtschaftung) sind Vorgaben des Hauses"
wiedervorlage = "mit den Vorgaben des Hauses vor dem Einsatz von Teilschritt 1a"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 2, Grobkalkulation", "Fachspezifikation Rechenkern, R-5.12, R-5.19, R-10.24, R-11.8, R-11.14, R-11.15"]
bemerkung = "Aus Prüfrunde 4 (Finanzmathematiker, Fachexperte, Praktiker). Prüfrunde 5: Bezug der Beleihungsquote auf die Summe aller Darlehen festgelegt, Gewicht von mittel auf hoch gesetzt, Wertansatz als Ausnahme von der Vorsichtsregel gekennzeichnet. Prüfrunde 1 zur Fachspezifikation des Rechenkerns (2026-11-18, Bank und Praktiker): neu geschnitten. Die Deckung über alle Darlehen ist jetzt Festlegung; der frühere Schalter verband Beleihungsraum und Deckung. Neu als vorsichtige Voreinstellung: kalkulatorischer Kapitaldienst und nachhaltiger Reinertrag; der Entwurf rechnete mit Vertragszins und dem Ertrag des Vorhabens. Prüfrunde 2 zur Fachspezifikation des Rechenkerns (2026-11-18) (Bank, Praktiker, Fachexperte): Der kalkulatorische Kapitaldienst für alle Tranchen ist durch den Bemessungszins je Tranche ersetzt; die frühere Voreinstellung bleibt als Lesart 4 umschaltbar. Die nachhaltige Miete im Neubau ist eigene Eingabe, ihre Voreinstellung Teil dieser Annahme. Am selben Tag aus der Richtlinie gelesen: Das Förderdarlehen ist nachrangig, und die vorrangigen Bankmittel sind mit mindestens 1 % zuzüglich ersparter Zinsen zu tilgen (Katalogwert, Regel). Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Umschaltbar sind nur noch die Lesarten 3 und 4, je als Lesart des Hauses und nicht je Vorhaben. Lesart 1 entfällt als Schalter, weil im geförderten Neubau die Schuldendienstdeckung bindet und nicht die Quote (keine Wirkung im Referenzfall). Lesart 2 entfällt als Schalter, weil die Vorgabe H-25 mit einem festen Satz in Höhe des Vertragszinses dasselbe leistet (auf den Cent). Der Wertansatz der Bank ist keine Eingabe mehr (E-61 entfallen); einen niedrigeren Beleihungswert bildet die Quote H-02 ab."

[[annahme]]
id = "MA-027"
titel = "Rechenregel der VOFI-Amortisationsdauer"
annahme = "Die Amortisationsdauer endet mit der Periode, von der an das Vermögen aus der Investition bei gedachtem Verkauf zum Wertpfad, nach Verkaufskosten, Ablösung der Restschuld und Steuern, die Anlage des eingesetzten Eigenkapitals zur Unterlassensalternative dauerhaft erreicht oder übertrifft."
grund = "Der Begriff ist belegt (Amortisationsdauer unter Berücksichtigung von Finanzierungskonditionen und steuerlichen Konsequenzen), die Rechenregel nach Grob liegt nicht am Original vor. Die zugänglichen Quellen beschreiben zwei verschiedene Regeln."
alternative = "Rückgewinnung des Eigenkapitals: die erste Periode, in der das Vermögen aus der Investition das eingesetzte Eigenkapital erreicht, ohne Vergleich mit der Unterlassensalternative. Diese Lesart amortisiert früher."
grundlage = "Quellnotiz 10 (research_notes): Suchauszug aus dem Stichwort VOFI im Gabler Banklexikon; Beitrag der Dr. Klein Wowi Redaktion vom 06.04.2021, am Original gelesen. Voreingestellt ist die Lesart mit der längeren Amortisationsdauer. Sie rechnet mit dem Wertpfad je Periode, den der Bericht in Anhang A, Nr. 18 verlangt: Ohne Restwert vor dem Verkauf ergäbe die Kennzahl bei jedem fremdfinanzierten Bestand nur die Haltedauer (Finanzmathematiker, Prüfrunde 5). Im Testfall des Berichts ergibt die Voreinstellung bei angenommenem linearem Wertpfad drei Jahre, die andere Lesart zwei."
quellen = ["GABLER-BANKLEXIKON-VOFI", "DRKLEIN-VOFI-2021", "GROB-EINFUEHRUNG"]
gewicht = "gering"
wirkung = "Ausgewiesene Amortisationsdauer auf dem Kennzahlenblatt; keine Wirkung auf Endwert, Rendite oder tragbaren Preis."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Fachliteratur (Grob, Einführung in die Investitionsrechnung) oder ein Hochschulskript, das die Regel wiedergibt"
wiedervorlage = "mit der Fachspezifikation des Kennzahlenblatts (Spezifikation Kapitel 3)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 3, Lehrbuchkennzahlen"]
bemerkung = "In Prüfrunde 5 neu gefasst: gedachter Verkauf zum Wertpfad und dauerhafte Überschreitung statt „ohne Restwert vor dem geplanten Verkauf“. Die Kennzahl steht damit erst mit dem Wertpfad ab der Vollkalkulation zur Verfügung. Die Gesamtkapitalrentabilität ist gelesen; ihre offene Einzelheit führt MA-028."

[[annahme]]
id = "MA-028"
titel = "Zuzurechnende Sollzinsen in der VOFI-Gesamtkapitalrentabilität"
annahme = "Der Anschaffungsauszahlung zuzurechnen ist die einfache Summe der Sollzinsen aller Darlehen, die die Anschaffungsauszahlung finanzieren, über den Betrachtungszeitraum; Zinsen auf den Kontokorrentkredit zählen nicht dazu."
grund = "Formel und Referenzzinsfuß der Kennzahl sind am Lexikoneintrag gelesen. Der Eintrag sagt aber nicht, wie die zuzurechnenden Sollzinsen abgegrenzt sind: ob als einfache Summe, ob einschließlich der Zinsen auf einen Kontokorrentkredit und wie bei mehreren Tranchen und Sondertilgungen."
alternative = "Einschließlich der Kontokorrentzinsen oder mit aufgezinsten Sollzinsen; Kennzahl und Referenzzinsfuß fielen dann beide höher aus."
grundlage = "Gabler Banklexikon, Stichwort VOFI-Gesamtkapitalrentabilität, als Bildschirmfoto gelesen am 18.11.2026 (Quellnotiz 10). Die Abgrenzung ändert die Entscheidung nicht: Die Sollzinsen gehen in Kennzahl und Referenzzinsfuß mit demselben Betrag ein, und die Kennzahl liegt genau dann über dem Referenzzinsfuß, wenn die Endwertdifferenz positiv ist. Im Testfall des Berichts ergibt die Voreinstellung 4,61 % gegen einen Referenzzinsfuß von 2,14 %."
quellen = ["GABLER-BANKLEXIKON-GKR"]
gewicht = "gering"
wirkung = "Ausgewiesene VOFI-Gesamtkapitalrentabilität und ihr Referenzzinsfuß auf dem vollen Kennzahlenblatt; keine Wirkung auf Endwert, Eigenkapitalrendite, Endwertdifferenz oder tragbaren Preis."
sichtbar = "anwender"
umschaltbar = false
klaerung = "Fachliteratur: Grob, Einführung in die Investitionsrechnung, nach `SCHULTE-IMMOBILIENINVESTITION-2025` (S. 813) dort S. 140 f."
wiedervorlage = "mit der Fachspezifikation des Kennzahlenblatts (Spezifikation Kapitel 3)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 3, Lehrbuchkennzahlen"]
bemerkung = "Aus Prüfrunde 5 (Sichtung, Punkt 17). Im Bildschirmfoto ist der Wurzelexponent des Referenzzinsfußes nicht zu erkennen; nach dem Aufbau der Formel ist es wie bei der Kennzahl die n-te Wurzel."

[[annahme]]
id = "MA-029"
titel = "Anknüpfung der De-minimis-Bindung der Sonderabschreibung"
annahme = "Die De-minimis-Bindung der Sonderabschreibung gilt, wenn die Sonderabschreibung im Rahmen der Gewinnermittlung von Einkünften aus Land- und Forstwirtschaft, Gewerbebetrieb oder selbständiger Arbeit beansprucht wird: bei Körperschaften, gewerblich geprägten und gewerblichen Personengesellschaften und bei Kapitalgesellschaften als Gesellschafterinnen einer vermögensverwaltenden Personengesellschaft (je Beteiligtem). Die Privatperson, die die Wohnung im Privatvermögen vermietet, ist nicht gebunden, auch wenn sie daneben eine Praxis oder ein Gewerbe hat."
grund = "Der Wortlaut des § 7b Abs. 5 Satz 2 EStG knüpft an die Person an; die Finanzverwaltung wendet die Bindung aber nur an, wenn die Sonderabschreibung in der Gewinnermittlung beansprucht wird. Ein Gericht könnte am Wortlaut anders entscheiden; praktisch ist das ohne Gewicht, weil die Verwaltung an ihr Schreiben gebunden ist."
alternative = "Wortlaut des § 7b Abs. 5 Satz 2 EStG: Gebunden ist jeder Anspruchsberechtigte mit solchen Einkünften, auch die Privatperson mit Praxis oder Gewerbe."
grundlage = "BMF-Schreiben vom 21.05.2025 zu § 7b EStG, Rn. 83, 87, 107; Mitunternehmerschaften je Beteiligtem (Rn. 101 bis 104, 112). Körperschaften sind nach beiden Lesarten gebunden (§ 8 Abs. 2 KStG)."
quellen = ["ESTG-7B", "KSTG-8", "BMF-7B-2025"]
gewicht = "gering"
wirkung = "Ob die Sonderabschreibung eines Investors mit solchen Einkünften an der De-minimis-Höchstgrenze endet; Steuerzahlungen und Rendite nach Steuern im Neubau."
sichtbar = "anwender"
umschaltbar = true
klaerung = "geklärt am Anwendungsschreiben der Finanzverwaltung"
wiedervorlage = "bei Neufassung des Anwendungsschreibens"
status = "bestaetigt"
gesetzt_am = "2026-11-18"
erledigt_am = "2026-11-18"
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage"]
bemerkung = "Aus Prüfrunde 5 (Jurist, Befund 1; Sichtung, Punkt 12). Am 2026-11-18 nach Quellnotiz 13 umgestellt: Bis dahin war die Anknüpfung an die Person voreingestellt (strengere Lesart des Wortlauts); die Verwaltungsauffassung ist die frühere „andere Lesart“. Die strengere Lesart bleibt umschaltbar."

[[annahme]]
id = "MA-030"
titel = "Erweiterte Kürzung und Verkaufsgewinn im Verkaufsjahr"
annahme = "Bleibt die erweiterte Grundstückskürzung im Verkaufsjahr erhalten – es verbleibt weiterer Grundbesitz im Unternehmen, oder Besitz, Nutzen und Lasten gehen zum 31.12., 23:59 Uhr, über (Eingabe E-69, voreingestellt nein) –, wird nach der Verwaltungsauffassung auch der Gewinn aus dem Verkauf des Objekts gekürzt. Ohne diese Eingabe gilt als Regel und nicht als Annahme: Geht der letzte Grundbesitz im Lauf des Jahres über, entfällt die erweiterte Kürzung für das ganze Verkaufsjahr, für den laufenden Ertrag wie für den Verkaufsgewinn; es bleibt die einfache Kürzung um die Grundsteuer, die die Steuer in Kurzform nicht rechnet. Nicht gerechnete Ausnahmen in jedem Fall: gewerblicher Grundstückshandel, Grundbesitz, der in den drei Jahren zuvor unter dem Teilwert eingebracht wurde, und Gewinne aus Mitunternehmeranteilen."
grund = "Dass der Verkaufsgewinn mitgekürzt wird, steht in einem Hinweis der Verwaltung, der nur in einer Verlagswiedergabe gelesen ist; das Urteil, auf das er sich stützt, ist nicht gelesen. Ein Gericht kann der Verwaltungsauffassung die Gefolgschaft versagen, und die Verwaltung kann den Hinweis ändern."
alternative = "Strengere Lesart (kein Schalter; wer sie tragen will, lässt E-69 auf nein): Der laufende Ertrag des Verkaufsjahres wird gekürzt, der Verkaufsgewinn ist gewerbesteuerpflichtig."
grundlage = "H 9.2 (1) und (3) GewStH in R 9.2 GewStR; BFH vom 11.08.2004, I R 89/03; BFH vom 17.10.2024, III R 1/23; § 9 Nr. 1 Satz 2, Satz 5 Nr. 2 und Satz 6 GewStG. Die Voreinstellung ohne E-69 ist die ungünstigste Rechnung und Regel; mit E-69 folgt die Voreinstellung der Verwaltungsauffassung und ist keine Ausnahme von der Vorsichtsregel im Sinn einer ungeprüften Setzung, wohl aber die günstigere der beiden Lesarten. Keine Annahme, sondern am Wortlaut belegt ist, dass Zinserträge nicht gekürzt werden."
quellen = ["GEWSTG-9", "GEWSTG-7", "GEWSTR-9-2", "BFH-III-R-1-23", "BFH-I-R-89-03"]
gewicht = "hoch"
wirkung = "Steuer im Verkaufsjahr, Endwert, Rendite und höchster tragbarer Preis bei Körperschaften und gewerblich geprägten Personengesellschaften mit Kennzeichen; die Weiche E-69 trägt den ganzen Verkaufsgewinn. Ankauf des Referenzfalls: Rendite 4,670 % ohne E-69 (Regel), 5,161 % mit E-69 (Voreinstellung dort) und 4,697 % mit E-69 nach der strengeren Lesart; die Gewerbesteuer auf den Verkaufsgewinn beträgt 139.930,00 Euro, der Wegfall der Kürzung des laufenden Ertrags im Verkaufsjahr kostet 7.952,00 Euro Endwert."
sichtbar = "kunde"
umschaltbar = false
klaerung = "Steuerberater des Auftraggebers (Risiken aus gewerblichem Grundstückshandel und aus der Einbringung unter dem Teilwert; Gestaltung des Übergangs)"
wiedervorlage = "mit der Antwort des Steuerberaters; spätestens vor dem Einsatz von Teilschritt 1a"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 1, Steuerstatus", "Spezifikation Kapitel 2, Grobkalkulation", "Fachspezifikation Rechenkern, R-7.8, R-7.14, R-9.5, Eingabe E-69, Meldung M-51"]
bemerkung = "Aus Prüfrunde 1 zur Fachspezifikation des Rechenkerns (Steuerberater, Befund 1). Der Entwurf hatte mit dem Kennzeichen den ganzen Gewerbeertrag freigestellt; das war eine nicht gekennzeichnete Ausnahme von der Vorsichtsregel. Prüfrunde 2 zur Fachspezifikation des Rechenkerns (2026-11-18) (Steuerberater, Hinweis 7) und Quellnotiz 13: Nach dem am 2026-11-18 am Original gelesenen Urteil BFH III R 1/23 ist der Wegfall der Kürzung im Verkaufsjahr Regel und jetzt Voreinstellung; die bisherige Voreinstellung (nur der Verkaufsgewinn gewerbesteuerpflichtig) gilt mit der neuen Eingabe „Übergang zum Jahresende“. Sollwerte der Referenzfälle mit Kennzeichen geändert (Differenzbericht aenderungen-runde2.md). Nachtrag 2 zur Überarbeitung nach Prüfrunde 2 (2026-11-18, Quellnotiz 15): drei Fälle statt drei Lesarten. Die Eingabe E-69 heißt jetzt „Erweiterte Kürzung bleibt im Verkaufsjahr erhalten“; mit ihr ist der Verkaufsgewinn nach H 9.2 (3) GewStH voreingestellt mitgekürzt, die frühere Rechnung (Verkaufsgewinn gewerbesteuerpflichtig) ist die strengere Lesart. Mit Kennzeichen und ohne E-69 gibt der Kern den Hinweis M-51 zurück. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Der Schalter der strengeren Lesart ist entfallen, weil die Eingabe E-69 dasselbe leistet: Die strengere Lesart weicht von „E-69 nein“ nur um die Kürzung des laufenden Ertrags im Verkaufsjahr ab (0,027 Prozentpunkte Rendite). Es gibt zwei Fälle: ohne E-69 entfällt die Kürzung im Verkaufsjahr, mit E-69 bleibt sie einschließlich des Verkaufsgewinns."

[[annahme]]
id = "MA-031"
titel = "Steuerliche Einordnung des NBank-Zuschusses im Betriebsvermögen"
annahme = "Im Betriebsvermögen – Körperschaften, gewerbliche und gewerblich geprägte Personengesellschaften, Einzelunternehmen – ist der Zuschuss der Wohnraumförderung Entgelt für die Belegungs- und Mietbindung und wird als passiver Rechnungsabgrenzungsposten über die Bindungsdauer verteilt versteuert. Eine Rückzahlung beim Verkauf mindert das laufende Ergebnis, nicht den Verkaufsgewinn. Bei Privatperson, Verein und Stiftung ist die Einnahme im Jahr des Zuflusses Regel der Verwaltung und keine Annahme; die Verteilung über die Bindung ist dort ein Wahlrecht bei einer Bindung von mehr als fünf Jahren (Eingabe „Verteilung beantragt“, voreingestellt nein), die Minderung der Herstellungskosten ist nicht wählbar."
grund = "Für das Betriebsvermögen äußert sich keine Richtlinie ausdrücklich zum Bindungszuschuss. Die Verteilung ist ein Schluss: Ein Zuschuss, der mit einer Gegenleistung verknüpft ist, ist kein Investitionszuschuss mit Wahlrecht, und Ertragszuschüsse für einen bestimmten Zeitraum sind abzugrenzen."
alternative = "Im Betriebsvermögen: Investitionszuschuss mit Wahlrecht, also Minderung der Herstellungskosten (nur der Anteil, der auf das Gebäude entfällt, mindert die Abschreibungsgrundlage) oder sofortige Einnahme. Beide sind umschaltbar. Bei Privatperson, Verein und Stiftung wirken diese Lesarten nicht."
grundlage = "Privatperson: R 21.5 Abs. 2 EStR und H 21.5 EStH, BFH vom 14.10.2003, IX R 60/02; Wahlrecht nach § 11 Abs. 1 Satz 3 EStG. Betriebsvermögen: R 6.5 Abs. 1 Satz 3 EStR und H 5.6 EStH, § 5 Abs. 5 EStG. Die Richtlinien sind im Wortlaut in Verlagswiedergabe gelesen. Begründete Ausnahme von der Vorsichtsregel: Im Betriebsvermögen ist „verteilt“ nicht die ungünstigste Lesart – die sofortige Einnahme liegt darunter, mit Kürzungskennzeichen auch die Minderung; voreingestellt ist die Einordnung, die sich aus den Richtlinien am ehesten ergibt."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026", "ESTR-21-5", "ESTR-6-5", "ESTH-5-6", "BFH-IX-R-60-02", "ESTG-5", "ESTG-11", "ESTG-7"]
gewicht = "hoch"
wirkung = "Steuer der Bauzeit und der Bindung, Eigenkapitalbedarf, Endwertdifferenz und Rendite im geförderten Neubau. Referenzfall mit 38 Jahren Haltedauer als Körperschaft: Rendite 3,956 % (verteilt, Voreinstellung) gegen 3,958 % (Minderung) und 3,559 % (sofortige Einnahme); mit Kürzungskennzeichen 4,001 % gegen 3,993 % und 3,771 %. Als Privatperson: 3,808 % mit Einnahme im Zuflussjahr (Regel), 4,380 % mit Verteilung auf Antrag."
sichtbar = "kunde"
umschaltbar = true
klaerung = "Steuerberater des Auftraggebers (Rechnungsabgrenzung in der Steuerbilanz; Verteilung bei der Privatperson; Zufluss eines Tilgungsnachlasses)"
wiedervorlage = "mit der Antwort des Steuerberaters; spätestens vor dem Förderteil (1c)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-7.3, R-7.4, R-7.19, R-11.14, Eingabe E-70"]
bemerkung = "Aus Prüfrunde 1 zur Fachspezifikation des Rechenkerns (Steuerberater, Befund 6; Grenzfälle, Befund 9). Der Entwurf minderte die Abschreibungsgrundlage um den ganzen Zuschuss, auch um den Anteil, der auf das Grundstück entfällt. Übersteigt der Zuschuss die Kosten, auf die er entfällt, rechnet der Kern nicht (Meldung). Prüfrunde 2 zur Fachspezifikation des Rechenkerns (2026-11-18) (Steuerberater 1, 2 und 4; Praktiker 4): Annahme neu gefasst. Voreinstellung nicht mehr die sofortige Einnahme, sondern je Kennzeichen „verteilt“ oder „Minderung“; die Rückzahlung steht im laufenden Ergebnis; das Entgelt auf den Zuschuss folgt der Lesart des Zuschusses. Nachtrag 2 zur Überarbeitung nach Prüfrunde 2 (2026-11-18, Quellnotiz 15): nach der Vermögenssphäre getrennt. Die Kopplung der Voreinstellung an das Kürzungskennzeichen entfällt. Für die Privatperson ist Befund 1 des Steuerberaters aus Prüfrunde 2 widerlegt (Einnahme im Zuflussjahr ist Regel), für das Betriebsvermögen bestätigt. Der Rechenkern rechnet Verein und Stiftung wie die Privatperson, weil er sie mit Überschusseinkünften führt (MA-041). Das Entgelt auf den Zuschuss folgt weiter der Lesart des Zuschusses; einen Tilgungsnachlass kennt die Grobförderung in Teil 1 nicht. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Umschaltbar ist nur noch „sofortige Einnahme“, als Lesart des Hauses. Die Minderung der Herstellungskosten rechnet der Kern nicht mehr: Sie führt im Referenzfall zur selben Rendite wie „verteilt“ (3,958 % gegen 3,956 %)."

[[annahme]]
id = "MA-032"
titel = "Bearbeitungsentgelt der NBank in der Steuer"
annahme = "Das Bearbeitungsentgelt der NBank auf das Darlehen ist laufzeitbezogen und wird über die zinslose Zeit verteilt – im Betriebsvermögen durch Rechnungsabgrenzung, bei Privatperson, Verein und Stiftung als Vorauszahlung für mehr als fünf Jahre. Das Entgelt auf den Zuschuss folgt der Behandlung des Zuschusses (MA-031)."
grund = "Ob das Entgelt der NBank eine Vergütung für die Überlassung des Kapitals über die Laufzeit ist oder ein einmaliges Entgelt für die Bearbeitung, sagt weder die Richtlinie noch der Entgeltkatalog."
alternative = "Das Entgelt ist im Jahr der Zahlung abziehbar."
grundlage = "Rechnungsabgrenzung nach § 5 Abs. 5 EStG und Verteilung von Vorauszahlungen nach § 11 Abs. 2 Satz 3 EStG, am Original gelesen. Angesetzt ist der ungünstigere Fall. Nicht mehr Teil der Annahme, sondern Regel: Die Vorfälligkeitsentschädigung der Privatperson beim Verkauf ist Veräußerungskosten (BMF vom 27.07.2015, Nr. 2). Für ein Disagio der Privatperson gilt die Prüfregel der Verwaltung (bis 5 % bei mindestens fünf Jahren Zinsbindung sofort abziehbar, der übersteigende Teil verteilt; BMF vom 20.10.2003, Rz. 15); Teil 1 rechnet kein Disagio der Privatperson, die Regel ist für Teil 2 vorgemerkt."
quellen = ["ESTG-5", "ESTG-11", "ESTG-23", "BMF-SCHULDZINSEN-2015", "BMF-BAUHERREN-2003"]
gewicht = "gering"
wirkung = "Zeitpunkt des Abzugs und damit Steuer der ersten Jahre und des Verkaufsjahres. Geförderter Neubau des Referenzfalls: Endwert 9.477.900,38 Euro mit Verteilung des Entgelts gegen 9.478.243,94 Euro bei Abzug im Jahr der Zahlung, bei gleicher Rendite von 3,956 %."
sichtbar = "anwender"
umschaltbar = false
klaerung = "Steuerberater des Auftraggebers"
wiedervorlage = "mit der Antwort des Steuerberaters; mit der Steuer in Grundform (Teil 2 der Fachspezifikation)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-7.2, R-7.15"]
bemerkung = "Aus Prüfrunde 1 zur Fachspezifikation des Rechenkerns (Steuerberater, Befund 5). Der Entwurf zog alle Finanzierungskosten im Jahr der Zahlung ab. Umschaltbar ist die Lesart zu den Entgelten; die beiden Punkte zur Privatperson sind fest gebaut und werden mit der Antwort des Steuerberaters überprüft. Prüfrunde 2 zur Fachspezifikation des Rechenkerns (2026-11-18) (Steuerberater 5): Laufzeitbezogene Entgelte werden auch bei der Privatperson verteilt (§ 11 Abs. 2 Satz 3 EStG); der Rundungsrest der Verteilung fällt ins Verkaufsjahr; das Entgelt auf den Zuschuss ist kein Entgelt für Schulden und folgt dem Zuschuss. Nachtrag 2 zur Überarbeitung nach Prüfrunde 2 (2026-11-18, Quellnotiz 15): auf das Bearbeitungsentgelt der NBank beschränkt. Die Vorfälligkeitsentschädigung der Privatperson ist Verwaltungsauffassung und in der Fachspezifikation als Regel geführt (R-7.11, R-7.15); das Disagio der Privatperson ist Prüfregel für Teil 2. Gewicht von mittel auf gering, weil im Referenzfall nur 343,56 Euro Endwert daran hängen. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Der Schalter „im Jahr der Zahlung“ ist entfallen (keine Wirkung auf die Rendite des Referenzfalls); der Kern verteilt die Entgelte. Die Frage an den Steuerberater ist gestrichen."

[[annahme]]
id = "MA-033"
titel = "Vorfälligkeitsentschädigung als Pauschale"
annahme = "Wird vor dem Ende der Zinsbindung verkauft, beträgt die Vorfälligkeitsentschädigung Restschuld mal Satz des Hauses mal Restbindung in Jahren. Die Restbindung endet spätestens mit dem gesetzlichen Kündigungsrecht des Darlehensnehmers. Für das NBank-Darlehen fällt keine Entschädigung an. Für das KfW-Darlehen fällt sie an wie für das Bankdarlehen, mit der Pauschale des Hauses; Teilrückzahlungen sind ausgeschlossen."
grund = "Die Bank berechnet ihren Zinsschaden aus dem Vertragszins, dem Wiederanlagezins am Tag der Ablösung, ersparten Kosten und Sondertilgungsrechten. Das Zinsniveau beim Verkauf ist heute nicht bekannt."
alternative = "Zinsschadenrechnung der Bank: Die Entschädigung kann null sein, wenn das Zinsniveau beim Verkauf über dem Vertragszins liegt, oder über der Pauschale, wenn es darunter liegt."
grundlage = "Anspruch der Bank nach § 490 Abs. 2 BGB und Kündigungsrecht nach zehn Jahren nach § 489 Abs. 1 Nr. 2 BGB, gelesen in der Prüfrunde (Bank, Fachexperte). Die Höhe der Pauschale ist Vorgabe des Hauses. Beim übernommenen Darlehen zählt die Frist des Kündigungsrechts ab dem Stichtag, weil das Datum des Empfangs keine Eingabe ist; das ist die längste Restbindung. KfW-Merkblatt 297/298 (Stand 07/2026), Abschnitt Tilgung: außerplanmäßige Tilgung nur vollständig und nur gegen Vorfälligkeitsentschädigung."
quellen = ["BGB-489", "BGB-490", "KFW-297-298-MERKBLATT"]
gewicht = "mittel"
wirkung = "Endwert und Rendite bei Verkauf vor dem Ende einer Zinsbindung; Haltedauertabelle und Stressfälle mit kurzer Haltedauer. Ankauf des Referenzfalls mit Verkauf nach einem Jahr: 108.146,07 Euro bei 1.201.623,01 Euro Restschuld. Bei 40 Jahren Zinsbindung begrenzt das Kündigungsrecht die Restbindung auf 114 Monate: 114.154,19 Euro statt einer Pauschale über 39 Jahre. Neubau mit KfW-Darlehen, Verkauf nach acht Jahren bei zehn Jahren Zinsbindung: 35.411,17 Euro für das Bankdarlehen und 52.203,65 Euro für das KfW-Darlehen."
sichtbar = "anwender"
umschaltbar = false
klaerung = "Hausbank"
wiedervorlage = "nach dem Gespräch mit der Hausbank; Zinsschadenrechnung mit der Vollkalkulation (Teil 2 der Fachspezifikation)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-5.16, Vorgabe H-18"]
bemerkung = "Aus Prüfrunde 1 zur Fachspezifikation des Rechenkerns (Bank, Befund 5; Fachexperte, Befund 3; Grenzfälle, Befund 5): Kappung am Kündigungsrecht ergänzt, Gewicht von gering auf mittel gesetzt. Nicht umschaltbar, weil die andere Lesart das Zinsniveau beim Verkauf als Eingabe braucht; der Satz ist als Vorgabe des Hauses veränderbar. Prüfrunde 2 zur Fachspezifikation des Rechenkerns (2026-11-18) und Quellnotiz 13: Wortlaut berichtigt – nur das NBank-Darlehen bleibt ohne Entschädigung; das KfW-Darlehen trägt sie wie das Bankdarlehen. Der Rechenkern rechnete das schon so; neu ist der Beleg. Im Jahresmodus wird der Kündigungstermin auf ganze Perioden aufgerundet."

[[annahme]]
id = "MA-034"
titel = "Prolongation mit unverändertem Tilgungssatz"
annahme = "Nach dem Ende der Zinsbindung setzt die Bank die Rate neu aus der Restschuld, dem Anschlusszins und dem anfänglichen Tilgungssatz, mindestens der Mindesttilgung des Hauses. Für die KfW-Tranche ist die Anschlusskondition festgelegt: Prolongationsangebot ohne Zinsverbilligung aus Bundesmitteln. Anschlusszins also Marktzins nach H-05, nicht Programmzins."
grund = "Wie prolongiert wird, vereinbaren Bank und Darlehensnehmer erst am Ende der Zinsbindung."
alternative = "Die bisherige Rate bleibt; oder die Restlaufzeit bleibt, und die Rate wird als Annuität über die verbleibende Laufzeit neu gerechnet. Keine von beiden ist wählbar."
grundlage = "Übliche Praxis nach Einschätzung der Prüfer; für die KfW-Tranche das KfW-Merkblatt 297/298, Abschnitt Zinssatz. Die drei Regeln lassen sich nicht für jede Größe in dieselbe Reihenfolge bringen: Der unveränderte Tilgungssatz ergibt die niedrigste Rate und damit die höchste Deckung nach der Zinsbindung, aber die niedrigste Endwertdifferenz und den niedrigsten tragbaren Preis. Nach der Rangfolge der Vorsicht (tragbarer Preis vor Endwertdifferenz vor Rendite) ist er die vorsichtige Lesart. Damit er keine Unterdeckung verbirgt, weist das Blatt die kleinste Deckung zusätzlich nach der Regel mit der niedrigsten Deckung aus und meldet danach."
quellen = ["KFW-297-298-MERKBLATT"]
gewicht = "mittel"
wirkung = "Rate, Restschuld und Deckung nach der Zinsbindung; Endwert nur gering. Ankauf des Referenzfalls: tragbarer Preis 2.317.235 Euro (Tilgungssatz bleibt) gegen 2.317.477 Euro (Rate bleibt) und 2.317.632 Euro (Restlaufzeit bleibt); Endwertdifferenz 753.701,96 Euro gegen 754.107,08 und 754.381,58 Euro; Deckung im Jahr 11 2,0853 gegen 1,8358 und 1,7002. Bei 3 % Zins und 0,5 % Mietsteigerung mit Vertragskonditionen: kleinste Deckung 1,3054 laut Finanzplan, 1,1975 nach der ungünstigsten Regel; im Stressfall 1,0181 gegen 0,8966."
sichtbar = "anwender"
umschaltbar = false
klaerung = "Hausbank"
wiedervorlage = "nach dem Gespräch mit der Hausbank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-5.8, R-5.9, R-10.14"]
bemerkung = "Aus Prüfrunde 1 zur Fachspezifikation des Rechenkerns (Bank, Frage 9; Controller, Befund 10). Die Regel „Restlaufzeit bleibt“ rundet die Restlaufzeit auf ganze Perioden ab und fällt ohne Tilgung auf den unveränderten Tilgungssatz zurück (Meldung). Prüfrunde 2 zur Fachspezifikation des Rechenkerns (2026-11-18) (Bank, Befund 3): Gewicht von gering auf mittel; Ausweis der kleinsten Deckung nach der ungünstigsten Anschlussregel. Quellnotiz 13: Anschlusskondition der KfW-Tranche aus dem Merkblatt belegt; der Rechenkern rechnete den Anschluss der KfW-Tranche schon mit dem Marktzins. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Die Vorgabe H-07 ist entfallen; der Kern rechnet fest mit „Tilgungssatz bleibt“. Die beiden anderen Regeln heben den tragbaren Preis des Referenzfalls um 242 und 397 Euro (unter 0,1 %); das Blatt weist weiter die kleinste Deckung nach der ungünstigsten Regel aus."

[[annahme]]
id = "MA-035"
titel = "CO2-Einstufung aus der Effizienzklasse"
annahme = "Ist der CO2-Ausstoß des Gebäudes nicht eingegeben, leitet der Katalog ihn aus Effizienzklasse und Energieträger ab und setzt den Ausstoß an der oberen Grenze der Klasse an."
grund = "Der Anteil des Vermieters an den CO2-Kosten richtet sich nach dem Ausstoß in Kilogramm CO2 je Quadratmeter und Jahr. Die Effizienzklasse des Energieausweises beruht auf dem Energiebedarf oder -verbrauch und nicht auf dem Ausstoß; die Umrechnung über den Energieträger ist eine Näherung."
alternative = "Der tatsächliche Ausstoß aus der Heizkostenabrechnung; er ist als Eingabe vorgesehen und geht der Näherung vor."
grundlage = "Stufen nach der Anlage zum Kohlendioxidkostenaufteilungsgesetz. Angesetzt ist der ungünstigere Fall innerhalb der Klasse."
quellen = ["CO2KOSTAUFG-5", "CO2KOSTAUFG-ANLAGE"]
gewicht = "gering"
wirkung = "Laufende Kosten des Vermieters im Bestand. Im Ankauf des Referenzfalls (30 kg je m², Vermieteranteil 40 %, 50 Euro je Tonne als Annahmen) 792 Euro im ersten Jahr bei 134.640 Euro Jahresmiete."
sichtbar = "anwender"
umschaltbar = false
klaerung = "Anwender je Vorhaben (Heizkostenabrechnung des Verkäufers)"
wiedervorlage = "mit der Vollkalkulation Ankauf Bestand (1b-1)"
status = "entfallen"
gesetzt_am = "2026-11-18"
erledigt_am = "2026-11-21"
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-6.9, Eingabe E-34, Katalogwert KAT-09"]
bemerkung = "Aus Prüfrunde 1 zur Fachspezifikation des Rechenkerns (Fachexperte, Befund 6). Nicht umschaltbar: Die andere Lesart ist die Eingabe des Ausstoßes. Der CO2-Preis ist keine Modellannahme, sondern eine Vorgabe des Hauses. Entfallen durch die Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Der Kern nähert den Ausstoß nicht mehr aus Effizienzklasse und Energieträger (E-54, E-55 entfallen). Ohne Angabe des Ausstoßes (E-34, freiwillig) rechnet er keinen Vermieteranteil an den CO2-Kosten; im Referenzfall sind das 0,4 % des tragbaren Preises (benannte Vereinfachung V-11 der Fachspezifikation)."

[[annahme]]
id = "MA-036"
titel = "Objektverkauf der GmbH & Co. KG: laufender Gewinn oder Aufgabegewinn"
annahme = "Der Gewinn aus dem Verkauf des Objekts ist bei der Personengesellschaft laufender Gewinn und gehört in voller Höhe zum Gewerbeertrag; die Gewerbesteuer wird bei natürlichen Personen angerechnet."
grund = "Hält die Gesellschaft nur dieses Objekt, kann der Verkauf die Aufgabe des Betriebs sein. Der Aufgabegewinn gehört nur insoweit zum Gewerbeertrag, als er nicht auf natürliche Personen als unmittelbar beteiligte Gesellschafter entfällt. Welcher Fall vorliegt, hängt vom Einzelfall und von der Rechtsprechung ab."
alternative = "Verkauf im Rahmen der Aufgabe des Betriebs: Die Gesellschaft wird mit dem Verkauf eingestellt; der Gewinn gehört dann nur insoweit zum Gewerbeertrag, als er nicht auf natürliche Personen als unmittelbar beteiligte Gesellschafter entfällt. Umschaltbar. Bei gewerblichem Grundstückshandel ist der Gewinn immer laufend."
grundlage = "Wortlaut von § 7 Satz 2 GewStG; Einordnung als Einschätzung des Steuerberaters in der Prüfrunde. Voreingestellt ist der laufende Gewinn: Bis zu einem Hebesatz in Höhe des Anrechnungsfaktors ist das wegen der Anrechnung nahezu neutral, darüber die ungünstigere Lesart. Tarifermäßigungen für Aufgabegewinne rechnet die Kurzform nicht. R 7.1 Abs. 3 Satz 4 GewStR und H 7.1 (3) GewStH; BFH vom 14.12.2006, IV R 3/05 (Gründe II.2): Verkauf während des Bestehens des Betriebs führt zu laufendem Gewinn, Verkauf im Rahmen einer Betriebsveräußerung oder -aufgabe ist begünstigt. Beide Einordnungen sind damit belegt; die Weiche ist eine Tatsachenfrage."
quellen = ["BFH-IV-R-3-05", "ESTG-15", "ESTG-35", "GEWSTG-7", "GEWSTR-7-1"]
gewicht = "mittel"
wirkung = "Steuer im Verkaufsjahr bei Personengesellschaften mit natürlichen Personen als Gesellschaftern. Ankauf des Referenzfalls bei 440 % Hebesatz und 60 % natürlichen Personen: Rendite 3,324 % als laufender Gewinn gegen 3,487 % als Aufgabegewinn."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Steuerberater des Auftraggebers"
wiedervorlage = "mit der Antwort des Steuerberaters; mit der Steuer in Grundform (Teil 2 der Fachspezifikation)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 1, Steuerstatus", "Fachspezifikation Rechenkern, R-7.18"]
bemerkung = "Aus Prüfrunde 1 zur Fachspezifikation des Rechenkerns (Steuerberater, Befund 8). Nachtrag 2 zur Überarbeitung nach Prüfrunde 2 (2026-11-18, Quellnotiz 15): Grundlage ergänzt; die Voreinstellung „laufender Gewinn“ bleibt; die andere Lesart heißt jetzt „Verkauf im Rahmen der Aufgabe des Betriebs“. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): umschaltbar nur noch als Lesart des Hauses, nicht je Vorhaben; gemessene Wirkung +0,163 Prozentpunkte Rendite, nur mit Kapitalgesellschaften als Gesellschaftern."

[[annahme]]
id = "MA-037"
titel = "Kappungsspielraum bei unbekannter Mietenhistorie"
annahme = "Ist die Mietenhistorie nicht eingegeben, gilt die letzte Mieterhöhung als zum Stichtag erfolgt und die Kappungsgrenze als ausgeschöpft: Die erste Erhöhung fällt frühestens nach der Wartefrist und frühestens einen Monat nach Ablauf des Kappungszeitraums ab dem Stichtag."
grund = "Wartefrist und Kappungsgrenze hängen davon ab, wann und um wie viel die Miete in den Jahren vor dem Ankauf erhöht wurde. Das Exposé nennt das in der Regel nicht; die Mieterliste liegt erst zur Vollkalkulation vor."
alternative = "Die letzte Erhöhung liegt mindestens den Kappungszeitraum zurück: Die Wartefrist ist abgelaufen, und die Kappungsgrenze steht voll zur Verfügung. Mit eingegebener Mietenhistorie entfällt die Annahme."
grundlage = "Wartefrist und Kappungsgrenze nach § 558 BGB, gelesen vom Fachexperten in der Prüfrunde; Werte je Gemeinde aus dem Katalog. Angesetzt ist der ungünstigere Fall."
quellen = ["BGB-558"]
gewicht = "mittel"
wirkung = "Mietpfad der ersten Jahre im Bestand, Reinertrag, Verkaufspreis und höchster tragbarer Preis. Ankauf des Referenzfalls: höchster tragbarer Preis 2.317.235 Euro gegen 2.322.775 Euro in der anderen Lesart; dort steigt die Miete schon im Monat 13 statt im Monat 37."
sichtbar = "anwender"
umschaltbar = false
klaerung = "Anwender je Vorhaben (Mieterliste des Verkäufers)"
wiedervorlage = "mit der Mieterliste der Vollkalkulation Ankauf Bestand (1b-1)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 2, Grobkalkulation", "Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-6.3, Eingabe E-33"]
bemerkung = "Aus Prüfrunde 1 zur Fachspezifikation des Rechenkerns (Fachexperte, Befund 1; Praktiker, Befund 5). Der Entwurf führte die Miete linear zur Marktmiete und prüfte nur die Kappung gegen die Miete drei Jahre zuvor. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Der Schalter ist entfallen, weil die Eingabe E-33 dasselbe leistet: Wer die Mietenhistorie kennt oder begründet annimmt, gibt sie ein. Im Referenzfall +0,031 Prozentpunkte; bei einer Ist-Miete 24 % unter der Vergleichsmiete +7,4 % des tragbaren Preises."

[[annahme]]
id = "MA-038"
titel = "Rückführung einer Miete über der Vergleichsmiete"
annahme = "Liegt die Ist-Miete über der ortsüblichen Vergleichsmiete, wird sie ab dem zweiten Planjahr über die Anpassungsdauer linear auf die Vergleichsmiete zurückgeführt; danach folgt sie der Vergleichsmiete."
grund = "Das Gesetz senkt keine vereinbarte Miete. Ob eine Miete über der Vergleichsmiete hält, hängt von Mieterwechseln, von der Durchsetzbarkeit und vom Markt ab."
alternative = "Die Miete bleibt stehen, bis die Vergleichsmiete sie eingeholt hat. Umschaltbar als Lesart des Hauses."
grundlage = "Einschätzung der Prüfer in Prüfrunde 2 zur Fachspezifikation (Fachexperte 4, Finanzmathematiker 3). Angesetzt ist die Lesart mit dem niedrigeren tragbaren Preis."
quellen = ["BGB-558"]
gewicht = "gering"
wirkung = "Mieteinzahlungen, Verkaufspreis und tragbarer Preis, wenn die Ist-Miete über der Vergleichsmiete liegt. Referenzfall mit 11,00 Euro Ist-Miete gegen 9,20 Euro Vergleichsmiete: tragbarer Preis 2.424.974 Euro gegen 2.470.976 Euro, wenn die Miete stehen bleibt; Endwertdifferenz 831.335,64 Euro gegen 905.596,44 Euro."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Auftraggeber (Erfahrung aus dem Bestand)"
wiedervorlage = "mit den Vorgaben des Hauses vor dem Einsatz von Teilschritt 1a"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 2, Grobkalkulation", "Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-6.3"]
bemerkung = "Aus Prüfrunde 2 zur Fachspezifikation des Rechenkerns (Sichtung, Punkt 14). In der Kapitaldienstrechnung der Bank zählt eine Miete über der Vergleichsmiete ohnehin nicht (MA-026). Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): umschaltbar nur noch als Lesart des Hauses; gemessene Wirkung +1,90 % des tragbaren Preises bei einer Ist-Miete von 11,00 Euro über der Vergleichsmiete von 9,20 Euro."

[[annahme]]
id = "MA-039"
titel = "Fortgeltung der Gebietsverordnungen zu Kappungsgrenze und Mietpreisbremse"
annahme = "Gilt am Stichtag eine Verordnung zur abgesenkten Kappungsgrenze oder zur Mietpreisbremse, gilt sie nach ihrem Ablauf mit einer Folgeverordnung fort; das Geltungsende ist Katalogwert."
grund = "Die Verordnungen sind befristet; ob das Land sie verlängert, ist eine Entscheidung der Zukunft. Das Gesetz lässt Verordnungen zur Mietpreisbremse spätestens Ende 2029 enden und begrenzt Kappungsverordnungen auf höchstens fünf Jahre."
alternative = "Die Verordnung endet mit ihrem Geltungsende; danach gilt die gesetzliche Kappungsgrenze, und die Mietpreisbremse entfällt."
grundlage = "§ 556d Abs. 2 und § 558 Abs. 3 BGB, gelesen in Prüfrunde 2 zur Fachspezifikation (Fachexperte 10). Angesetzt ist die Lesart mit dem niedrigeren tragbaren Preis. Vorsichtig ist sie nur, wo am Stichtag eine Verordnung gilt."
quellen = ["BGB-556D", "BGB-558"]
gewicht = "mittel"
wirkung = "Mietpfad nach dem Geltungsende, Verkaufspreis und tragbarer Preis. Ankauf des Referenzfalls: tragbarer Preis 2.317.235 Euro gegen 2.319.295 Euro ohne Fortgeltung; Endwertdifferenz 753.701,96 Euro gegen 757.210,62 Euro. Bei längerer Haltedauer und größerem Abstand zur Vergleichsmiete wächst die Wirkung."
sichtbar = "anwender"
umschaltbar = false
klaerung = "Land als Verordnungsgeber; Beobachtung über den Katalog"
wiedervorlage = "mit jeder neuen Gebietsverordnung des Landes; spätestens 2029"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 2, Grobkalkulation", "Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-6.3, R-6.13, R-6.18"]
bemerkung = "Aus Prüfrunde 2 zur Fachspezifikation des Rechenkerns (Sichtung, Punkt 17). Die Ausnahme der Mietpreisbremse für die Wohnung nach BGB-556F gilt dauerhaft; „liegt im Gebiet“ ist je Vorhaben überschreibbar. Das Geltungsende der niedersächsischen Verordnungen im Referenzkatalog ist eine Annahme und noch am Verordnungstext zu lesen. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Der Schalter ist entfallen, weil das Kennzeichen E-05 dasselbe leistet: „außerhalb“ ergibt im Referenzfall auf den Euro dasselbe wie das Auslaufen der Verordnung. Im Neubau ist E-05 keine Eingabe; dort gilt der Katalogwert."

[[annahme]]
id = "MA-040"
titel = "Beginn der tilgungsfreien Jahre des KfW-Darlehens"
annahme = "Die tilgungsfreien Anlaufjahre und die Laufzeit des KfW-Darlehens zählen ab dem ersten Abruf."
grund = "Das Merkblatt nennt Laufzeitvarianten mit tilgungsfreien Anlaufjahren, sagt aber nicht, ob sie ab der Zusage, ab dem ersten Abruf oder ab der Bezugsfertigkeit zählen; die Konditionenübersicht der KfW ist nicht gelesen."
alternative = "Die Anlaufjahre zählen ab der Bezugsfertigkeit; die Tilgung beginnt dann später. Zählten sie ab der Zusage, begänne die Tilgung noch früher."
grundlage = "KfW-Merkblatt 297/298, gelesen in Prüfrunde 2 zur Fachspezifikation (Fachexperte 1). Vorsichtig ist die Voreinstellung für die Deckung, weil die Tilgung früher beginnt. Nach der Rangfolge der Vorsicht ist sie es nicht: Der tragbare Grundstückspreis des Referenzfalls liegt mit ihr um 1.447 Euro höher. Die Voreinstellung ist deshalb als Ausnahme gekennzeichnet; sie folgt der Sichtung der Prüfrunde 2."
quellen = ["KFW-297-298-MERKBLATT"]
gewicht = "mittel"
wirkung = "Tilgungsbeginn, Deckung der ersten Jahre und Bemessung des Bankdarlehens im Neubau mit KfW-Darlehen. Referenzfall: Tilgung ab Monat 20 gegen Monat 31; Deckung im ersten Jahr der Vollvermietung 1,3857 gegen 1,6583; tragbarer Grundstückspreis 1.197.094 Euro gegen 1.195.647 Euro."
sichtbar = "anwender"
umschaltbar = false
klaerung = "Hausbank; KfW"
wiedervorlage = "nach dem Gespräch mit der Hausbank; mit dem Lesen der Konditionenübersicht der KfW"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 2, Grobkalkulation", "Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-5.10, R-5.19"]
bemerkung = "Aus Prüfrunde 2 zur Fachspezifikation des Rechenkerns (Sichtung, Punkt 8). Der Zins des KfW-Darlehens ist Eingabe; der Katalogwert ist Platzhalter, solange die Konditionenübersicht nicht im Kataster gelesen ist. Durchsicht an der Wesentlichkeitsschwelle (2026-11-21): Der Schalter ist entfallen (−0,002 Prozentpunkte Rendite); die Annahme bleibt, die Frage an die Hausbank ist gestrichen."

[[annahme]]
id = "MA-041"
titel = "Vermietung von Verein und Stiftung als Vermögensverwaltung"
annahme = "Die Vermietung des Wohnungsbestands eines Vereins oder einer Stiftung ist Vermögensverwaltung: Es fällt keine Gewerbesteuer an, die Einkünfte werden nach dem Zahlungsprinzip ermittelt, und der Verkauf nach Ablauf der Frist für private Veräußerungsgeschäfte ist steuerfrei."
grund = "Vereine und Stiftungen sind nicht kraft Rechtsform gewerblich. Ob ihre Vermietung im Einzelfall die Grenze zum wirtschaftlichen Geschäftsbetrieb oder zum Gewerbebetrieb überschreitet, hängt von Umfang und Zusatzleistungen ab."
alternative = "Die Vermietung ist gewerblich; dann gilt die Besteuerung der Körperschaft mit Gewerbesteuer. Nicht umschaltbar: Der Bearbeiter wählt in diesem Fall den Steuerstatus „Körperschaft“."
grundlage = "§ 1 Abs. 1 und § 8 Abs. 2 KStG, gelesen in Prüfrunde 2 zur Fachspezifikation (Steuerberater 3); im Übrigen dessen Einschätzung. Die Voreinstellung ist die günstigere Lesart; sie ist die Regel für den Steuerstatus, den der Bearbeiter gewählt hat, und der Steuerstatus ist seine Angabe. Der Freibetrag nach § 24 KStG ist vorsichtig nicht gerechnet. Nach § 14 Satz 3 AO liegt Vermögensverwaltung in der Regel vor, wenn unbewegliches Vermögen vermietet oder verpachtet wird."
quellen = ["KSTG-1", "KSTG-8", "KSTG-24", "AO-14"]
gewicht = "gering"
wirkung = "Steuer, Endwert und Rendite beim Steuerstatus „Verein und Stiftung“. Ankauf des Referenzfalls: Rendite 5,520 % gegen 4,527 % bei Besteuerung als Körperschaft mit Gewerbesteuer."
sichtbar = "anwender"
umschaltbar = false
klaerung = "im Einzelfall der Steuerberater des Investors; die allgemeine Frage ist durch das Gesetz beantwortet"
wiedervorlage = "mit der Antwort des Steuerberaters"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 2, Grobkalkulation", "Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-7.1, R-7.17, R-9.5"]
bemerkung = "Aus Prüfrunde 2 zur Fachspezifikation des Rechenkerns (Sichtung, Punkt 20). Die Fassung nach Prüfrunde 1 besteuerte den Verkaufsgewinn unabhängig von der Haltedauer und verteilte Entgelte wie im Betriebsvermögen. Nachtrag 2 zur Überarbeitung nach Prüfrunde 2 (2026-11-18, Quellnotiz 15): Die Frage an den Steuerberater ist entfallen (§ 14 Satz 3 AO). Die Annahme bleibt für den Einzelfall mit Zusatzleistungen von Gewicht geführt; ob sie geschlossen wird, entscheidet die Projektleitung."
