[[annahme]]
id = "MA-001"
titel = "Rechenweise der NBank-Renditeprüfung"
annahme = "Das Werkzeug weist die Eigenkapitalrendite für die Überkompensationsprüfung aus dem eigenen Finanzplan des Vorhabens aus und vergleicht sie mit dem 30-Jahres-Swapsatz zuzüglich 100 Basispunkten; Bewirtschaftungskosten, Mietsteigerung, Restwert und Betrachtungszeitraum folgen den Annahmen des Vorhabens."
grund = "Die Richtlinie nennt Verfahren und Schwelle, die NBank veröffentlicht aber weder ihre Rechenannahmen noch ein Rechenblatt."
alternative = "Die NBank rechnet mit eigenen Pauschalen (etwa nach II. BV), ohne Restwert oder über einen festen Zeitraum; dann weicht ihre Rendite von der des Werkzeugs ab."
grundlage = "Richtlinie Mietwohnraum 2026, Nummern 5.3.7 und 11.10."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "hoch"
wirkung = "Aussage, ob die Förderung als angemessen gilt oder gekürzt wird; trägt den Nutzen des Werkzeugs im Fördergeschäft."
sichtbar = "kunde"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, NBank-Renditeprüfung"]
bemerkung = "Bis zur Klärung wird die Kennzahl als eigene Berechnung des Werkzeugs bezeichnet, nicht als Ergebnis der NBank-Prüfung."

[[annahme]]
id = "MA-002"
titel = "Tilgungsplan des NBank-Darlehens"
annahme = "Das zinslose Darlehen wird in gleichbleibenden Raten so getilgt, dass es nach 42 Jahren zurückgezahlt ist. Die Raten fallen im Takt des Rechenrasters an, im Monatsraster also monatlich; Tilgung, zinslose Zeit und Bindung zählen ab dem Monat nach der Bauzeit."
grund = "Die Richtlinie nennt nur die Höchstlaufzeit; den Tilgungsplan setzt die NBank im Einzelfall fest. Ein fester Tilgungssatz steht nicht mehr in der Richtlinie."
alternative = "Fester Tilgungssatz mit Restschuld am Ende oder schnellere Tilgung nach Vorgabe der NBank; Jahresraten statt Monatsraten; Beginn mit der Vollauszahlung statt mit der Bezugsfertigkeit."
grundlage = "Richtlinie Mietwohnraum 2026: Rückzahlung binnen 42 Jahren."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "mittel"
wirkung = "Liquidität und Schuldendienstdeckung je Jahr; Endwert nur gering, weil das Darlehen 35 Jahre zinslos ist. Monatsraten statt Jahresraten ändern den Kapitaldienst des Jahres nicht, senken aber den laufenden Beitrag leicht, weil die Restschuld früher fällt. Im geförderten Neubau des Referenzfalls beträgt der Kapitaldienst des Förderdarlehens 150.431,28 Euro im ersten Jahr der Vollvermietung; er entscheidet mit darüber, dass kein Bankdarlehen bleibt."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank; im Einzelfall der Bewilligungsbescheid"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-5.11, R-11.14"]
bemerkung = "Prüfrunde 1 zur Fachspezifikation des Rechenkerns (2026-11-18): Annahme auf Raten im Takt des Rasters umgestellt; der frühere Wortlaut nannte Jahresraten, der Kern rechnet im Monatsraster Monatsraten. Fragen an die NBank: Jahres- oder Monatsraten, Beginn mit Vollauszahlung oder Bezugsfertigkeit, Beginn der zinslosen Zeit."

