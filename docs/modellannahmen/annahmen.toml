[[annahme]]
id = "MA-001"
titel = "Rechenweise der NBank-Renditeprüfung"
annahme = "Das Werkzeug weist die Eigenkapitalrendite für die Überkompensationsprüfung aus dem eigenen Finanzplan des Vorhabens aus und vergleicht sie mit dem 30-Jahres-Swapsatz zuzüglich 100 Basispunkten; Bewirtschaftungskosten, Mietsteigerung, Restwert und Betrachtungszeitraum folgen den Annahmen des Vorhabens."
grund = "Die Richtlinie nennt Verfahren und Schwelle, die NBank veröffentlicht aber weder ihre Rechenannahmen noch ein Rechenblatt."
alternative = "Die NBank rechnet mit eigenen Pauschalen (etwa nach II. BV), ohne Restwert oder über einen festen Zeitraum; dann weicht ihre Rendite von der des Werkzeugs ab."
grundlage = "Richtlinie Mietwohnraum 2026, Nummern 5.3.7 und 11.10."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "hoch"
wirkung = "Aussage, ob die Förderung als angemessen gilt oder gekürzt wird; trägt den Nutzen des Werkzeugs im Fördergeschäft."
sichtbar = "kunde"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, NBank-Renditeprüfung"]
bemerkung = "Bis zur Klärung wird die Kennzahl als eigene Berechnung des Werkzeugs bezeichnet, nicht als Ergebnis der NBank-Prüfung."

[[annahme]]
id = "MA-002"
titel = "Tilgungsplan des NBank-Darlehens"
annahme = "Das zinslose Darlehen wird in gleichbleibenden Raten im Takt des Rechenrasters getilgt, im Monatsraster also monatlich."
grund = "Beginn und Ende der Tilgung stehen in der Richtlinie: Beginn am Monatsersten nach der vollständigen Auszahlung, spätestens zwei Jahre nach dem Monat, der auf die Förderentscheidung folgt; Rückzahlung längstens 42 Jahre nach Bezugsfertigkeit; Aufschub des Beginns um bis zu fünf Jahre. Offen ist nur die Form der Raten: Die Modalitäten setzt die NBank fest."
alternative = "Jahresraten statt Monatsraten; steigende oder nach Vorgabe der NBank gestaffelte Raten."
grundlage = "Richtlinie Mietwohnraum 2026, Nummer 5.3.5."
quellen = ["NBANK-RL-MIETWOHNRAUM-2026"]
gewicht = "gering"
wirkung = "Liquidität innerhalb des Jahres und laufender Beitrag; Endwert nur gering, weil das Darlehen 35 Jahre zinslos ist. Im geförderten Neubau des Referenzfalls: Tilgung ab Monat 23 in 500 Raten von 10.462,98 Euro; Kapitaldienst zu Bemessungskonditionen 151.713,24 Euro im Jahr."
sichtbar = "anwender"
umschaltbar = true
klaerung = "NBank"
wiedervorlage = "nach dem Gespräch mit der NBank; im Einzelfall der Bewilligungsbescheid"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regeln auf ungeklärter Grundlage", "Fachspezifikation Rechenkern, R-5.11, R-11.14"]
bemerkung = "Prüfrunde 1 zur Fachspezifikation des Rechenkerns (2026-11-18): Annahme auf Raten im Takt des Rasters umgestellt; der frühere Wortlaut nannte Jahresraten, der Kern rechnet im Monatsraster Monatsraten. Fragen an die NBank: Jahres- oder Monatsraten, Beginn mit Vollauszahlung oder Bezugsfertigkeit, Beginn der zinslosen Zeit. Richtlinie am 2026-11-18 gegen die Fragenliste gelesen (Quellnotiz 12): Beginn und Ende der Tilgung, Aufschub und zinslose Zeit sind Regel (Fachspezifikation R-5.11) und keine Annahme mehr; die Annahme betrifft nur noch die Form der Raten, Gewicht von mittel auf gering. Der Rechenkern setzt die Förderentscheidung in den Monat vor dem Baubeginn (Festlegung NF-65)."

