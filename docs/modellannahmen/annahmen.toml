titel = "Verlustverrechnung ab 2028"
annahme = "Verlustvorträge oberhalb von 1 Mio. € sind bis Veranlagungszeitraum 2027 zu 70 % und ab 2028 zu 60 % verrechenbar."
grund = "Geklärt am Bundesgesetzblatt: Die Rückkehr auf 60 % ab dem Veranlagungszeitraum 2028 ist verkündetes Recht."
alternative = "Es bleibt auch ab 2028 bei 70 %."
grundlage = "Wachstumschancengesetz, BGBl. 2024 I Nr. 108: Art. 6 ersetzt in § 10d Abs. 2 Satz 1 EStG „70 Prozent“ durch „60 Prozent“, erstmals für den Veranlagungszeitraum 2028; Art. 6 tritt am 01.01.2028 in Kraft (Art. 35 Abs. 9)."
quellen = ["ESTG-10D", "BGBL-2024-I-108"]
gewicht = "mittel"
wirkung = "Steuerzahlungen von Vorhaben mit Anlaufverlusten ab 2028."
sichtbar = "anwender"
umschaltbar = true
klaerung = "geklärt am Bundesgesetzblatt"
wiedervorlage = "mit der nächsten vierteljährlichen Rechtsprüfung"
status = "bestaetigt"
gesetzt_am = "2026-11-18"
erledigt_am = "2026-11-18"
verwendet_in = ["Spezifikation Kapitel 4, Regel- und Förderkatalog"]
bemerkung = "Bestätigt am 2026-11-18 (Quellnotiz 15). Die Regel ist damit Festlegung im Katalog; eine Gesetzesänderung vor 2028 fängt die vierteljährliche Rechtsprüfung."

