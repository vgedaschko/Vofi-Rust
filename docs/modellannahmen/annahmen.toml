[[annahme]]
id = "MA-025"
titel = "Modernisierungsumlage für den Glasfaseranschluss"
annahme = "Für den erstmaligen Glasfaseranschluss wird keine Modernisierungsumlage angesetzt."
grund = "Der Wortlaut steht in Spannung: § 559 Abs. 1 Satz 1 BGB nennt die Maßnahmen nach § 555b Nr. 1, 3, 4, 5 und 6, nicht Nr. 4a; Satz 2 regelt aber, wann die Erhöhung im Fall der Nr. 4a zulässig ist, und setzt ihre Umlage damit voraus."
alternative = "Nr. 4a ist umlagefähig, über Satz 2 oder weil der Anschluss den Gebrauchswert nach Nr. 4 erhöht: 8 % der Kosten, wenn der Mieter seinen Anbieter frei wählen kann und kein Bereitstellungsentgelt als Betriebskosten umgelegt wird oder wurde."
grundlage = "§ 555b Nr. 4a und § 559 Abs. 1 Satz 2 BGB. Angesetzt ist der für den Vermieter ungünstigere Fall."
quellen = ["BGB-555B", "BGB-559"]
gewicht = "gering"
wirkung = "Mieterlös nach Glasfaserausbau."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Anwalt"
wiedervorlage = "mit der Rechtsprüfung vor dem Kundeneinsatz"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 4, Regel- und Förderkatalog"]
bemerkung = "Aus Prüfrunde 3 (Jurist); Grund und andere Lesart nach Prüfrunde 4 (Jurist) neu gefasst. Frage an den Anwalt: Ist Nr. 4a über § 559 Abs. 1 Satz 2 oder über Nr. 4 umlagefähig?"

[[annahme]]
id = "MA-026"
titel = "Rechengrundlage der Bankgrenze in der Grobkalkulation"
annahme = "Die Bank gibt höchstens das Darlehen, dessen Schuldendienst die Mindestdeckung einhält, gerechnet aus dem Reinertrag im ersten Jahr der Vollvermietung gegen den Kapitaldienst aller Darlehen einschließlich des Förderdarlehens. Sie beleiht bis zur Beleihungsquote den Kaufpreis, beim Neubau die Gesamtkosten, nicht einen eigenen Beleihungswert."
grund = "Wie eine Bank Kapitaldienstfähigkeit und Beleihung im Einzelfall rechnet, ist nicht veröffentlicht und von Haus zu Haus verschieden: mit welchem Ertrag, ob mit dem Kapitaldienst eines Förderdarlehens und auf welchen Wert."
alternative = "Die Bank rechnet die Mindestdeckung nur gegen ihr eigenes Darlehen; dann fällt das Bankdarlehen im geförderten Neubau höher aus. Oder sie setzt einen eigenen Wert an, etwa einen Beleihungswert unter dem Kaufpreis; dann fällt es niedriger aus."
grundlage = "Gegenrechnungen der Prüfrunde 4 (Finanzmathematiker, Fachexperte, Praktiker). Bei der Mindestdeckung ist der ungünstigere Fall angesetzt. Beim Wertansatz ist der Kaufpreis eine Vereinfachung, weil die Grobkalkulation keinen Beleihungswert kennt; er ist deshalb als „Wertansatz der Bank“ überschreibbar, und das Blatt zeigt, ob Beleihungsquote oder Mindestdeckung das Darlehen begrenzt."
quellen = []
gewicht = "mittel"
wirkung = "Höhe des Bankdarlehens und damit höchster tragbarer Preis, nötiges Eigenkapital und Rendite in der Grobkalkulation."
sichtbar = "kunde"
umschaltbar = true
klaerung = "Hausbank; die Schwellen selbst (Beleihungsquote, Mindestdeckung) sind Vorgaben des Hauses"
wiedervorlage = "mit den Vorgaben des Hauses vor dem Einsatz von Teilschritt 1a"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 2, Grobkalkulation"]
bemerkung = "Aus Prüfrunde 4 (Finanzmathematiker, Fachexperte, Praktiker). Ob die Beleihungsquote im geförderten Neubau nur das Bankdarlehen oder die Summe aller Darlehen begrenzt, ist in der Fachspezifikation festzulegen."

[[annahme]]
id = "MA-027"
titel = "Rechenregel der VOFI-Amortisationsdauer"
annahme = "Die Amortisationsdauer endet in der ersten Periode, in der das Vermögen aus der Investition die Anlage des eingesetzten Eigenkapitals zur Unterlassensalternative erreicht oder übertrifft. Vor dem geplanten Verkauf wird dabei kein Restwert der Immobilie angesetzt."
grund = "Der Begriff ist belegt (Amortisationsdauer unter Berücksichtigung von Finanzierungskonditionen und steuerlichen Konsequenzen), die Rechenregel nach Grob liegt nicht am Original vor. Die zugänglichen Quellen beschreiben zwei verschiedene Regeln."
alternative = "Rückgewinnung des Eigenkapitals: die erste Periode, in der das Vermögen aus der Investition das eingesetzte Eigenkapital erreicht, ohne Vergleich mit der Unterlassensalternative; mit oder ohne Ansatz eines Restwerts. Diese Lesart amortisiert früher."
grundlage = "Quellnotiz 10 (research_notes): Suchauszug aus dem Stichwort VOFI im Gabler Banklexikon; Beitrag der Dr. Klein Wowi Redaktion vom 06.04.2021, am Original gelesen. Voreingestellt ist die Lesart mit der längeren Amortisationsdauer."
quellen = ["GABLER-BANKLEXIKON-VOFI", "DRKLEIN-VOFI-2021", "GROB-EINFUEHRUNG"]
gewicht = "gering"
wirkung = "Ausgewiesene Amortisationsdauer auf dem Kennzahlenblatt; keine Wirkung auf Endwert, Rendite oder tragbaren Preis."
sichtbar = "anwender"
umschaltbar = true
klaerung = "Fachliteratur (Grob, Einführung in die Investitionsrechnung) oder ein Hochschulskript, das die Regel wiedergibt"
wiedervorlage = "mit der Fachspezifikation des Kennzahlenblatts (Spezifikation Kapitel 3)"
status = "offen"
gesetzt_am = "2026-11-18"
erledigt_am = ""
verwendet_in = ["Spezifikation Kapitel 3, Offene Lehrbuchdefinitionen"]
bemerkung = "Die Gesamtkapitalrentabilität ist keine Annahme: Sie wird nicht ausgewiesen, bis ihre Formel gelesen ist."
