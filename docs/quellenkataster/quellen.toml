bemerkung = "Berichtigung Prüfrunde 2: abziehbar bis Zinsertrag plus verrechenbares EBITDA; dieses ist bereits 30 % des steuerlichen EBITDA. Ausnahmen Abs. 2 Buchst. b (kein Konzern) und c (Eigenkapitalvergleich) als Eingaben; BMF-Anwendungsschreiben (März 2025) nicht gelesen."

