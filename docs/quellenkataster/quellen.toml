bemerkung = "Berichtigung Prüfrunde 2: 5.200 €/m² ist keine Deckelung, sondern schließt die Sonderabschreibung ganz aus; Rückabwicklung bei nachträglichen Kosten über der Grenze binnen drei Jahren, Nutzungsänderung oder steuerfreier Veräußerung binnen zehn Jahren. Beim Erwerb nur „neu“ bis Ende des Fertigstellungsjahres."

