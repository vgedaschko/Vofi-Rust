bemerkung = "Berichtigung Prüfrunde 2: degressive Abschreibung (Abs. 5a) nur bei Herstellung oder Anschaffung bis Ende des Fertigstellungsjahres, nicht beim Ankauf älterer Bestände; Herstellungsbeginn = Baubeginnsanzeige. Abschreibungsregeln an Vorhabensart und Nutzung binden, nicht an die Investorensicht."

