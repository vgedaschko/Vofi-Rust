verwendet_fuer = ["Abschreibung Wohngebäude linear 3/2/2,5 %", "Degressive Abschreibung 5 % im Neubau", "3 % für Nichtwohngebäude im Betriebsvermögen", "Zeitanteilige Abschreibung im Erstjahr"]
